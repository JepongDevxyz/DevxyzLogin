<script>
/* ================= profile editor (capture §4) ================= */
const ED_TABS=[["overview","Overview"],["proxy","Proxy"],["timezone","Timezone"],["extensions","Extensions"],["bookmarks","Bookmarks"],["geolocation","Geolocation"],["advanced","Advanced"],["cookies","Cookies"]];
function proxyUiMode(p){return p.proxy.mode==="builtin"?"gologin":p.proxy.mode==="custom"?"your":"none"}
function openEditor(pid,cloudAndroid,startTab){
  let draft, isNew=false;
  if(pid){const p=findProfile(pid); if(!p)return; draft=clone(p)}
  else{isNew=true; draft=makeProfile(); draft.cloudAndroid=!!cloudAndroid;
    draft.proxy.mode="builtin"; draft.proxy.buyCountry="FR"; /* capture default: Gologin proxy, France */
    const fr=countryByCode("FR"); draft.fp.country=fr[0]; draft.fp.countryName=fr[1]; draft.fp.flag=fr[2]; draft.proxy.flag=fr[2]; draft.proxy.country=fr[1];
    const d=S.defaults; draft.fp.startUrl=d.startUrl; draft.fp.launchArgs=d.launchArgs; draft.fp.customDns=d.customDns;
    draft.fp.browserVersion="Chrome "+d.browserVersion; draft.fp.saveHistory=d.saveHistory; draft.fp.saveBookmarks=d.saveBookmarks;
    draft.fp.savePasswords=d.savePasswords; draft.fp.storageLocal=d.storageLocal; draft.fp.storageIndexedDb=d.indexedDb;
    draft.fp.extStorage=d.extStorage; draft.fp.systemExt=d.systemExt; draft.fp.disableImages=d.disableImages; draft.fp.disableAutoplay=d.disableAutoplay;
    if(cloudAndroid)draft.fp=genFingerprint("Android");
  }
  editorCtx={draft:draft,isNew:isNew,tab:startTab||"proxy",cloud:!!cloudAndroid||draft.cloudAndroid};
  renderEditor();
}
function closeEditor(){const e=$("#editorOverlay");if(e)e.remove();editorCtx=null}
function renderEditor(){
  const ctx=editorCtx, d=ctx.draft;
  let ov=$("#editorOverlay");
  if(!ov){ov=document.createElement("div");ov.id="editorOverlay";document.body.appendChild(ov)}
  ov.innerHTML='<div class="ed-wrap"><div class="crumb"><b>'+esc(S.workspace)+'</b> <span>›</span> <span>Dashboard</span></div>'
  +'<div class="ed-head"><h1>'+(ctx.isNew?"New Browser Profile":"Edit Profile")+'</h1></div>'
  +'<div class="ed-grid"><div class="ed-main">'
  +'<div style="display:flex;gap:12px"><div class="field" style="flex:1"><label class="label">Profile Name</label><input class="input" id="edName" value="'+esc(d.name)+'"></div>'
  +'<div class="field" style="width:210px"><label class="label">Folder</label><select class="input" id="edFolder"><option value="">No folder</option>'+S.folders.map(f=>'<option value="'+f.id+'" '+(((d.folderIds||[])[0]===f.id||d.folderId===f.id)?"selected":"")+'>'+esc(f.name)+'</option>').join("")+'</select></div></div>'
  +'<div class="ed-tabs">'+ED_TABS.map(t=>'<button class="ed-tab'+(ctx.tab===t[0]?" sel":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join("")+'<button class="ed-tab" id="edTabMore" title="More tabs">…</button></div>'
  +'<div id="edPanel"></div>'
  +'</div><div class="ed-summary" id="edSummary"></div></div></div>'
  +'<div class="sticky-bar"><div class="in" style="display:flex;gap:10px"><button class="btn btn-primary" id="edCreate" style="min-width:170px">'+(ctx.isNew?"Create Profile":"Save changes")+'</button><button class="btn" id="edCancel">Cancel</button><span class="sub-text" id="edHint" style="align-self:center"></span></div></div>';
  ov.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ctx.tab=b.dataset.tab;renderEditor()});
  ov.querySelector("#edTabMore").onclick=e=>{e.stopPropagation();const m=openMenu(e.currentTarget,ED_TABS.map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join(""));m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ctx.tab=b.dataset.t;closeMenus();renderEditor()})};
  ov.querySelector("#edName").oninput=e=>{d.name=e.target.value;edSummary()};
  ov.querySelector("#edFolder").onchange=e=>{const v=e.target.value;d.folderIds=v?[v]:[];d.folderId=v;edSummary()};
  ov.querySelector("#edCancel").onclick=closeEditor;
  ov.querySelector("#edCreate").onclick=saveEditor;
  renderEdPanel(); edSummary(); updateCreateBtn();
}
function updateCreateBtn(){
  const ctx=editorCtx; if(!ctx)return; const b=$("#edCreate"), h=$("#edHint"); if(!b)return;
  const dis=ctx.isNew&&proxyUiMode(ctx.draft)==="gologin"&&ctx.draft.proxy.dedicated;
  b.disabled=!!dis; if(h)h.textContent=dis?"Create is disabled while “Buy dedicated IP” is selected — it requires a paid subscription.":"";
}
function edSummary(){
  const d=editorCtx.draft, fp=d.fp;
  const proxyTxt=proxyUiMode(d)==="gologin"?(d.proxy.dedicated?"none":"DevxyzLogin"):(proxyUiMode(d)==="your"?(d.proxy.type||"http").toLowerCase():"none");
  const rows=[["Profile name",d.name],["Folder",(S.folders.find(f=>f.id===(d.folderIds||[])[0])||{}).name||"No folder"],["Proxy",proxyTxt],
   ["Languages","Based on IP"],["Timezone",fp.timezoneAuto?"Based on IP":fp.timezone],["Geolocation",fp.geoAuto?"Based on IP":fp.geoMode],
   ["WebGL Info",fp.webglMetadata==="Mask"?"Masked":"Real"],["Media Devices",fp.mediaMasking===false?"Real":"Masked"],
   ["Canvas",fp.canvas==="Off"?"off":"Masked with noise"],["Client Rects",fp.clientRects.toLowerCase()],
   ["WebGL Metadata",fp.webglMetadata.toLowerCase()],["WebGL Image",fp.webglImage==="Off"?"off":"Masked with noise"],
   ["Audio Context",fp.audioContext==="Noise"?"noise":"off"],["Fonts",fp.fontsCount+" fonts"],["UA",fp.browserVersion],
   ["Resolution",fp.screen],["OS",fp.os],["Browser","Orbita"],["Platform",fp.platform],["User-Agent",fp.ua],
   ["Media devices","("+fp.mediaVideo+"|"+fp.mediaAudioIn+"|"+fp.mediaAudioOut+")"],["Local Storage",String(!!fp.storageLocal)],["Ext. Storage",String(!!fp.extStorage)],["Plugins",String(!!fp.pluginsVuln)]];
  $("#edSummary").innerHTML='<h3>Profile Summary</h3>'+rows.map(r=>'<div class="sum-row"><span class="sl">'+r[0]+'</span><span class="sv">'+esc(r[1])+'</span></div>').join("");
}
function saveEditor(){
  const ctx=editorCtx, d=ctx.draft;
  if(!d.name.trim())return toast("Profile name is required",1);
  d.lastUpdate=nowStr();
  let snap=null;
  if(ctx.isNew){d.createdAt=nowStr(); profileSeq++; hist(d,"Profile created"); S.profiles.unshift(d); toast("Profile created")}
  else{const orig=findProfile(d.id); if(orig){snap=clone(orig); d.history=orig.history||[]; hist(d,"Profile edited"); const i=S.profiles.indexOf(orig); S.profiles[i]=d} toast("Profile saved")}
  save(); if(window.DL)DL.profileSaved(d,ctx.isNew,snap); const target=ctx.cloud?"cloud":"profiles"; closeEditor(); showPage(target);
}
function segRow(options,current,cb,cls){
  const wrap=document.createElement("div"); wrap.className="seg "+(cls||"");
  wrap.innerHTML=options.map(o=>'<button data-v="'+esc(o)+'" class="'+(o===current?"sel":"")+'">'+esc(o)+'</button>').join("");
  wrap.querySelectorAll("button").forEach(b=>b.onclick=()=>{cb(b.dataset.v);renderEdPanel();edSummary();updateCreateBtn()});
  return wrap;
}
function radioRow(options,current,cb){
  const wrap=document.createElement("div"); wrap.className="radio-pill";
  wrap.innerHTML=options.map(o=>'<button data-v="'+esc(o)+'" class="'+(o===current?"sel":"")+'">'+esc(o)+'</button>').join("");
  wrap.querySelectorAll("button").forEach(b=>b.onclick=()=>{cb(b.dataset.v);edSummary()});
  return wrap;
}
function switchRow(label,on,cb,info){
  const row=document.createElement("div"); row.className="kv-row";
  row.innerHTML='<span class="kl" style="width:auto;flex:1">'+esc(label)+(info?' <span class="info-i" title="'+esc(info)+'">ⓘ</span>':"")+'</span>'+switchHtml(on,"sw"+Math.random().toString(36).slice(2,7));
  row.querySelector("input").onchange=e=>{cb(e.target.checked);edSummary()};
  return row;
}
function fieldWrap(label,el,info){
  const w=document.createElement("div"); w.className="field";

function countryCombo(val,cb){

    list.innerHTML=hits.slice(0,CAP).map(x=>'<button data-c="'+x[0]+'" class="'+(x[0]===val?"sel":"")+'">'+x[2]+" "+x[1]+'</button>').join("")+(hits.length>CAP?'<div class="combo-more">+'+(hits.length-CAP)+' more — type to filter</div>':"")+(hits.length===0?'<div class="combo-more">No matches</div>':"");
    list.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const cc=countryByCode(b.dataset.c);input.value=cc[2]+" "+cc[1];list.classList.add("hidden");cb(cc[0]);edSummary()})};
  input.onfocus=()=>{input.value="";renderList("");list.classList.remove("hidden")};

async function checkProxyFlow(px){
  const type=String(px.type||"HTTP").toUpperCase(), host=px.host||"", port=String(px.port||"");
  if(px.mode!=="builtin"){
    if(!host||!/^\d{1,5}$/.test(port)||+port<1||+port>65535)return toast("Proxy check failed: enter a valid host and port (1–65535)",1);
    if(!/^[a-zA-Z0-9.\-]+$/.test(host))return toast("Proxy check failed: host format looks invalid",1);
  }
  if(!window.DL||!DL.isSynced()){
    const ov=openModal("Check Proxy",'<p style="font-size:14px">🔒 Sign in to run a live proxy check</p><p class="sub-text" style="margin-top:8px">Live checks run through your DevxyzLogin server account and report the proxy\'s real exit IP, country, timezone and latency. In local mode nothing leaves this device, so only the format can be verified here.</p>','<button class="btn" data-close="1">Close</button><button class="btn btn-primary" id="cpSignIn">Sign in</button>');
    ov.querySelector("#cpSignIn").onclick=()=>{closeModal();S.session=null;save();gate()};
    return;
  }
  toast("Checking proxy…");
  let target={type:type.toLowerCase(),host:host,port:+port,username:px.login||"",password:px.password||""};
  if(px.mode==="builtin"){
    try{
      const b=await api("/api/proxies/builtin",{method:"POST",body:{country:px.buyCountry||"FR",type:String(px.type||"Residential").toLowerCase()}});
      const mapped=fromServerSharedProxy(b.proxy);
      if(!S.proxies.find(x=>x.serverId===mapped.serverId))S.proxies.push(mapped);
      save();
      target={type:b.proxy.proxy.type,host:b.proxy.proxy.host,port:b.proxy.proxy.port,username:b.proxy.proxy.username,password:b.proxy.proxy.password};
    }catch(e){
      if(e.status===501)return openModal("Check Proxy",'<p style="font-size:14px">Built-in proxies are not available yet</p><p class="sub-text" style="margin-top:8px">No residential provider is configured on the DevxyzLogin server, so there is no built-in proxy to check. Add your own proxy and the checker will verify it for real.</p>','<button class="btn btn-primary" data-close="1">OK</button>');
      return toast("Proxy check failed: "+(e.network?"server unreachable":e.message),1);
    }
  }
  try{
    const j=await api("/api/proxies/check",{method:"POST",body:target});
    return openModal("Check Proxy",'<p style="font-size:14px">✓ Proxy is working</p><div class="sum-row"><span class="sl">Exit IP</span><span class="sv">'+esc(j.ip||"")+'</span></div><div class="sum-row"><span class="sl">Country</span><span class="sv">'+esc(j.country||"")+(j.countryCode?" ("+esc(j.countryCode)+")":"")+'</span></div>'+(j.city?'<div class="sum-row"><span class="sl">City</span><span class="sv">'+esc(j.city)+'</span></div>':"")+'<div class="sum-row"><span class="sl">Timezone</span><span class="sv">'+esc(j.timezone||"")+'</span></div><div class="sum-row"><span class="sl">Latency</span><span class="sv">'+esc(j.latencyMs||"")+' ms</span></div>','<button class="btn btn-primary" data-close="1">OK</button>');
  }catch(e){
    if(e.body&&e.body.ok===false)return toast("Proxy check failed: "+(e.body.error||"proxy unreachable"),1);
    return toast("Proxy check failed: "+(e.network?"server unreachable":e.message),1);
  }
}
function stepper(val,min,max,cb){
  const w=document.createElement("span"); w.className="stepper";
  w.innerHTML='<button data-d="-1">−</button><input value="'+val+'"><button data-d="1">＋</button>';
  const input=w.querySelector("input");
  w.querySelectorAll("button").forEach(b=>b.onclick=()=>{let v=Math.min(max,Math.max(min,(parseInt(input.value)||min)+ +b.dataset.d));input.value=v;cb(v);edSummary()});
  input.onchange=()=>{let v=Math.min(max,Math.max(min,parseInt(input.value)||min));input.value=v;cb(v)};
  return w;
}

<script>
/* ================= DevxyzLogin server wiring v4 — real auth, sync, tokens, proxy check =================
   Auth lives under its own localStorage key (devxyzlogin_auth), separate from the
   devxyzlogin_v1 app store. When AUTH is null the app is fully local and makes
   ZERO network calls. Server items are tracked with a `serverId` field on the
   local entity; the server is the source of truth for serverId-bearing items,
   local-only items upload via POST and gain serverIds. Mutations are optimistic:
   a server (HTTP) failure rolls the change back with an honest toast, a network
   failure keeps the change locally, flags it _dirty and shows the Offline state —
   flushDirty() replays dirty items when the connection returns. */
const AUTH_KEY="devxyzlogin_auth", PURGE_KEY="devxyzlogin_purged";
const API_DEFAULT="https://devxyzlogin-server.vercel.app";
let AUTH=null;
try{const a=JSON.parse(localStorage.getItem(AUTH_KEY));if(a&&typeof a.token==="string"&&a.token)AUTH={token:a.token,email:a.email||"",workspaceId:a.workspaceId||null,purged:Array.isArray(a.purged)?a.purged:[]}}catch(e){}
let syncState=AUTH?"synced":"local"; /* synced | local | offline */
let syncBusy=false, flushBusy=false;
function apiBase(){const u=(S.serverUrl||"").trim().replace(/\/$/,"");return u||API_DEFAULT}
function saveAuth(){if(AUTH)localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH));else localStorage.removeItem(AUTH_KEY)}
function loadPurged(email){try{const m=JSON.parse(localStorage.getItem(PURGE_KEY))||{};return Array.isArray(m[email])?m[email]:[]}catch(e){return[]}}
function addPurged(email,sid){try{const m=JSON.parse(localStorage.getItem(PURGE_KEY))||{};m[email]=[...new Set([...(m[email]||[]),sid])];localStorage.setItem(PURGE_KEY,JSON.stringify(m))}catch(e){}}
function chipHtml(){if(!AUTH)return '<span style="color:var(--muted)">●</span> Local mode';if(syncState==="offline")return '<span style="color:#e8a13a">●</span> Offline — changes saved locally';return '<span style="color:#22c07a">●</span> Synced'}
function updateSyncChip(){const el=document.getElementById("syncChip");if(!el)return;el.innerHTML=chipHtml();el.title=!AUTH?"Local mode — data stays on this device":(syncState==="offline"?"Server unreachable — changes are saved locally and sync when you are back":"Signed in as "+AUTH.email+" — profiles sync with the DevxyzLogin server")}
function setOnline(){if(AUTH&&syncState!=="synced"){syncState="synced";updateSyncChip()}if(AUTH&&!syncBusy)flushDirty()}
function setOffline(){if(AUTH&&syncState!=="offline"){syncState="offline";updateSyncChip()}}
window.addEventListener("online",()=>{if(AUTH)syncFromServer()});
window.addEventListener("offline",()=>setOffline());
function authExpired(){AUTH=null;saveAuth();syncState="local";updateSyncChip();toast("Session expired — you are in local mode now. Your data on this device is unchanged.",1)}

async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(AUTH){headers["Authorization"]="Bearer "+AUTH.token;if(AUTH.workspaceId)headers["X-Workspace-Id"]=AUTH.workspaceId}
  let r;
  try{r=await fetch(apiBase()+path,{method:opts.method||"GET",headers:headers,body:opts.body!==undefined?JSON.stringify(opts.body):undefined})}
  catch(e){setOffline();const er=new Error("network unreachable");er.network=true;throw er}
  let j=null; try{j=await r.json()}catch(e){}
  if(r.status===401&&AUTH&&path.indexOf("/api/auth/")!==0){authExpired();const er=new Error("session expired");er.status=401;throw er}
  if(!r.ok||!j||j.ok===false){const er=new Error((j&&j.error)||("HTTP "+r.status));er.status=r.status;er.body=j;throw er}
  setOnline();
  return j;
}

/* ---------- web <-> shared-schema mapping ---------- */
const OS_KEY_TO_NAME={}; Object.keys(OS_CONFIG).forEach(n=>{OS_KEY_TO_NAME[OS_CONFIG[n].key]=n});
function capMode(v){v=String(v||"").toLowerCase();return v==="noise"?"Noise":v==="block"?"Block":"Off"}
function toServerProfile(p){
  const fp=p.fp||{};
  let px=p.proxy||{};
  if(px.proxyId){const sp=S.proxies.find(x=>x.id===px.proxyId);if(sp)px=Object.assign({},px,{host:px.host||sp.host,port:px.port||sp.port,type:px.type||sp.type,login:px.login||sp.login,password:px.password||sp.password})}
  return {
    name:p.name||"Untitled profile", notes:p.notes||"",
    folderIds:(p.folderIds&&p.folderIds.length?p.folderIds.slice():(p.folderId?[p.folderId]:[])),
    tags:(p.tags||[]).map(t=>typeof t==="string"?t:t.text),
    status:p.state==="running"?"running":"ready",
    os:(OS_CONFIG[fp.os]||{}).key||"linux",
    fingerprint:{
      navigator:{userAgent:fp.ua||"",browserVersion:fp.browserVersion||"",screenResolution:fp.screen||"1920x1080",languages:fp.languages||["en-US"],platform:fp.platform||"",cpuCores:fp.cpu||8,ram:fp.ram||8,doNotTrack:!!fp.doNotTrack,languagesAuto:fp.languagesAuto!==false},
      fontsMasking:fp.fontsMasking!==false,
      mediaDevices:{videoInputs:fp.mediaVideo||0,audioInputs:fp.mediaAudioIn||0,audioOutputs:fp.mediaAudioOut||0},
      mediaMasking:fp.mediaMasking!==false,
      hardware:{canvasMode:String(fp.canvas||"off").toLowerCase(),webglVendor:fp.webglVendor||"",webglRenderer:fp.webglRenderer||"",webglNoise:fp.webgl==="Noise",audioNoise:fp.audioContext==="Noise",clientRectsNoise:fp.clientRects==="Noise"},
      webrtcMode:fp.webrtc==="Based on IP"?"basedOnIp":String(fp.webrtc||"off").toLowerCase(),
      timezone:{auto:fp.timezoneAuto!==false,zone:fp.timezone||"UTC"},
      geolocation:{mode:String(fp.geoMode||"prompt").toLowerCase(),auto:fp.geoAuto!==false,lat:parseFloat(fp.geoLat)||0,lon:parseFloat(fp.geoLong)||0}
    },
    proxy:{mode:px.mode==="builtin"?"devxyz":(px.mode||"none"),type:String(px.type||"http").toLowerCase(),host:px.host||"",port:parseInt(px.port,10)||0,username:px.login||"",password:px.password||"",buyCountry:px.buyCountry||"FR",buyType:px.buyType||"Residential",dedicated:!!px.dedicated,changeIpUrl:px.changeIpUrl||""},
    extensions:(p.extensions||[]).slice(),
    bookmarks:String(p.bookmarks||"").split("\n"),
    /* web-native extras — the server stores unknown fields verbatim, so the web model round-trips losslessly */
    fp:fp, webProxy:p.proxy||{}, webTags:p.tags||[], state:p.state||"ready",
    statusField:p.statusField||null, pinned:!!p.pinned, cloudAndroid:!!p.cloudAndroid,
    lastLaunch:p.lastLaunch||"", lastUpdate:p.lastUpdate||"", createdAtLocal:p.createdAt||"",
    cookies:p.cookies||[], history:p.history||[], folderId:p.folderId||""
  };
}
function fpFromSchema(sp){
  const f=sp.fingerprint||{}, nav=f.navigator||{}, hw=f.hardware||{}, md=f.mediaDevices||{}, tz=f.timezone||{}, geo=f.geolocation||{};
  const osName=OS_KEY_TO_NAME[sp.os]||"Linux";
  const base=genFingerprint(osName);
  return Object.assign(base,{
    os:osName, ua:nav.userAgent||base.ua, browserVersion:nav.browserVersion||base.browserVersion,
    screen:nav.screenResolution||base.screen, languages:(nav.languages&&nav.languages.length)?nav.languages:base.languages,
    platform:nav.platform||base.platform, cpu:nav.cpuCores||base.cpu, ram:nav.ram||base.ram, doNotTrack:!!nav.doNotTrack,
    languagesAuto:nav.languagesAuto!==false,
    fontsMasking:f.fontsMasking!==false, mediaMasking:f.mediaMasking!==false,
    mediaVideo:md.videoInputs!=null?md.videoInputs:base.mediaVideo, mediaAudioIn:md.audioInputs!=null?md.audioInputs:base.mediaAudioIn, mediaAudioOut:md.audioOutputs!=null?md.audioOutputs:base.mediaAudioOut,
    canvas:capMode(hw.canvasMode), webgl:hw.webglNoise?"Noise":"Off", webglVendor:hw.webglVendor||base.webglVendor, webglRenderer:hw.webglRenderer||base.webglRenderer,
    audioContext:hw.audioNoise?"Noise":"Off", clientRects:hw.clientRectsNoise?"Noise":"Off",
    webrtc:f.webrtcMode==="basedOnIp"?"Based on IP":(f.webrtcMode==="disabled"?"Disabled":"Off"),
    timezoneAuto:tz.auto!==false, timezone:tz.zone||base.timezone,
    geoMode:geo.mode?(geo.mode.charAt(0).toUpperCase()+geo.mode.slice(1)):base.geoMode, geoAuto:geo.auto!==false,
    geoLat:String(geo.lat!=null?geo.lat:base.geoLat), geoLong:String(geo.lon!=null?geo.lon:base.geoLong)
  });
}
function proxyFromSchema(px){
  px=px||{};
  return Object.assign(defaultProxy(),{mode:px.mode==="devxyz"?"builtin":(px.mode||"none"),type:String(px.type||"http").toUpperCase(),host:px.host||"",port:px.port?String(px.port):"",login:px.username||"",password:px.password||"",buyCountry:px.buyCountry||"FR",buyType:px.buyType||"Residential",dedicated:!!px.dedicated,changeIpUrl:px.changeIpUrl||""});
}
function fromServerProfile(sp){
  const fp=sp.fp?migrateFp(clone(sp.fp)):fpFromSchema(sp);
  const tags=(Array.isArray(sp.webTags)&&sp.webTags.length)?clone(sp.webTags):(sp.tags||[]).map((t,i)=>typeof t==="string"?{text:t,color:TAG_COLORS[i%TAG_COLORS.length]}:t);
  const p={id:sp.id, serverId:sp.id, name:sp.name||"Untitled profile", notes:sp.notes||"",
    state:sp.state||(sp.status==="running"?"running":"ready"),
    folderId:(sp.folderIds||[])[0]||sp.folderId||"", folderIds:sp.folderIds||[],
    tags:tags, statusField:sp.statusField||{...STATUS_FIELDS[0]},
    pinned:!!sp.pinned, cloudAndroid:!!sp.cloudAndroid,
    lastLaunch:sp.lastLaunch||"", lastUpdate:sp.lastUpdate||fmtDate(sp.updatedAt||sp.createdAt||Date.now()),
    proxy:sp.webProxy?Object.assign(defaultProxy(),clone(sp.webProxy)):proxyFromSchema(sp.proxy),
    fp:fp, cookies:sp.cookies||[], extensions:sp.extensions||[],
    bookmarks:Array.isArray(sp.bookmarks)?sp.bookmarks.join("\n"):(sp.bookmarks||""),
    createdAt:sp.createdAtLocal||fmtDate(sp.createdAt||Date.now()),
    history:sp.history||[{t:fmtDate(sp.createdAt||Date.now()),a:"Profile created"}]};
  if(sp.deletedAt){p.deletedAt=fmtDate(sp.deletedAt);p.deletedBy=(AUTH&&AUTH.email)||""}
  return p;
}
function toServerSharedProxy(px){
  return {id:px.id, name:px.name||"Proxy",
    proxy:{mode:"custom",type:String(px.type||"http").toLowerCase(),host:px.host||"",port:parseInt(px.port,10)||0,username:px.login||"",password:px.password||""},
    country:px.country||"", flag:px.flag||"", ip:px.ip||"", state:px.state||"Connected", kind:px.kind||"Custom", notes:px.notes||"", archived:!!px.archived};
}
function fromServerSharedProxy(sp){
  const pr=sp.proxy||{};
  return {id:sp.id, serverId:sp.id, name:sp.name||"Proxy", type:String(pr.type||"http").toUpperCase(), host:pr.host||"", port:pr.port?String(pr.port):"", login:pr.username||"", password:pr.password||"", country:sp.country||"", flag:sp.flag||"", ip:sp.ip||pr.host||"", state:sp.state||"Connected", kind:sp.kind||"Custom", notes:sp.notes||"", archived:!!sp.archived};
}

/* ---------- merge (server -> local) ---------- */
function adoptFolderId(f,newId){
  const oldId=f.id; f.id=newId; f.serverId=newId; delete f._dirty;
  S.profiles.concat(S.deleted).forEach(p=>{let touched=false;if(p.folderId===oldId){p.folderId=newId;touched=true}if(Array.isArray(p.folderIds)&&p.folderIds.includes(oldId)){p.folderIds=p.folderIds.map(x=>x===oldId?newId:x);touched=true}if(touched&&p.serverId)p._dirty=true});
  if(activeFolder===oldId)activeFolder=newId;
}
async function mergeWorkspaces(serverList){
  const activeName=S.workspace;
  for(const w of [...S.workspaces]){
    if(serverList.find(x=>x.id===w.id))continue;
    const byName=serverList.find(x=>x.name===w.name);
    if(byName){w.id=byName.id;continue}
    try{const j=await api("/api/workspaces",{method:"POST",body:{name:w.name}});w.id=j.workspace.id;serverList.push(j.workspace)}
    catch(e){/* stays local-only; retried on next sync */}
  }
  const serverIds=new Set(serverList.map(w=>w.id));
  const localOnly=S.workspaces.filter(w=>!serverIds.has(w.id));
  S.workspaces=[...serverList.map(w=>({id:w.id,name:w.name})),...localOnly];
  const act=S.workspaces.find(w=>w.name===activeName)||S.workspaces.find(w=>w.id===AUTH.workspaceId)||S.workspaces[0];
  if(act){AUTH.workspaceId=act.id;S.workspace=act.name}
}
function mergeProfiles(serverActive,serverTrash){
  const purged=new Set(AUTH.purged||[]);
  const findLocal=sid=>{let i=S.profiles.findIndex(p=>p.serverId===sid);if(i>-1)return{arr:S.profiles,i};i=S.deleted.findIndex(p=>p.serverId===sid);if(i>-1)return{arr:S.deleted,i};return null};
  const applyList=(list,wantTrash)=>{
    const seen=new Set();
    for(const sp of list){
      if(purged.has(sp.id))continue;
      seen.add(sp.id);
      const loc=findLocal(sp.id);
      if(loc&&loc.arr[loc.i]._dirty)continue; /* unsynced local changes win; flush replays them */
      const mapped=fromServerProfile(sp);
      if(loc){mapped.id=loc.arr[loc.i].id;loc.arr.splice(loc.i,1)}
      (wantTrash?S.deleted:S.profiles).unshift(mapped);
    }
    return seen;
  };
  const activeSeen=applyList(serverActive,false);
  const trashSeen=applyList(serverTrash,true);
  S.profiles=S.profiles.filter(p=>!p.serverId||activeSeen.has(p.serverId)||p._dirty);
  S.deleted=S.deleted.filter(p=>!p.serverId||trashSeen.has(p.serverId)||p._dirty);
}
function mergeFolders(serverFolders){
  const seen=new Set();
  for(const sf of serverFolders){
    seen.add(sf.id);
    const loc=S.folders.find(f=>f.serverId===sf.id);
    if(loc){if(!loc._dirty)loc.name=sf.name}
    else S.folders.push({id:sf.id,serverId:sf.id,name:sf.name});
  }
  S.folders=S.folders.filter(f=>!f.serverId||seen.has(f.serverId)||f._dirty);
}
function mergeProxies(serverProxies){
  const seen=new Set();
  for(const sp of serverProxies){
    seen.add(sp.id);
    const i=S.proxies.findIndex(x=>x.serverId===sp.id);
    if(i>-1){if(S.proxies[i]._dirty)continue;const mapped=fromServerSharedProxy(sp);mapped.id=S.proxies[i].id;S.proxies[i]=mapped}
    else S.proxies.push(fromServerSharedProxy(sp));
  }
  S.proxies=S.proxies.filter(x=>!x.serverId||seen.has(x.serverId)||x._dirty);
}
async function syncFromServer(){
  if(!AUTH||syncBusy)return; syncBusy=true;
  try{
    const ws=await api("/api/workspaces");
    await mergeWorkspaces(ws.workspaces||[]);
    saveAuth();
    const res=await Promise.all([api("/api/profiles"),api("/api/profiles?deleted=1"),api("/api/folders"),api("/api/proxies")]);
    mergeFolders(res[2].folders||[]);
    mergeProfiles(res[0].profiles||[],res[1].profiles||[]);
    mergeProxies(res[3].proxies||[]);
    save();
    await flushDirty(true);
    save();
    if(S.session){showPage(currentPage);if(currentPage==="pa")switchPa(paPage)}
  }catch(e){ if(e.status!==401)setOffline(); }
  finally{syncBusy=false}
}

/* ---------- flush (local -> server): creates, dirty patches, pending restores/deletes ---------- */
async function flushDirty(force){
  if(!AUTH||flushBusy)return; if(syncBusy&&!force)return; flushBusy=true;
  try{
    for(const f of [...S.folders]){
      if(!f.serverId){try{const j=await api("/api/folders",{method:"POST",body:{name:f.name}});adoptFolderId(f,j.folder.id)}catch(e){f._dirty=true}}
      else if(f._dirty){try{await api("/api/folders/"+f.serverId,{method:"PATCH",body:{name:f.name}});delete f._dirty}catch(e){if(!e.network)delete f._dirty}}
    }
    for(const p of [...S.profiles]){
      if(!p.serverId){try{const j=await api("/api/profiles",{method:"POST",body:toServerProfile(p)});p.serverId=j.profile.id;delete p._dirty;delete p._restorePending}catch(e){p._dirty=true}}
      else{
        if(p._restorePending){try{await api("/api/profiles/"+p.serverId+"/restore",{method:"POST"});delete p._restorePending}catch(e){/* stays pending */}}
        if(p._dirty){try{await api("/api/profiles/"+p.serverId,{method:"PATCH",body:toServerProfile(p)});delete p._dirty}catch(e){if(!e.network)delete p._dirty}}
      }
    }
    for(const p of [...S.deleted]){
      if(!p.serverId){try{const j=await api("/api/profiles",{method:"POST",body:toServerProfile(p)});p.serverId=j.profile.id;await api("/api/profiles/"+p.serverId,{method:"DELETE"});delete p._dirty}catch(e){p._dirty=true}}
      else if(p._dirty){try{await api("/api/profiles/"+p.serverId,{method:"DELETE"});delete p._dirty}catch(e){if(!e.network)delete p._dirty}}
    }
    for(const px of [...S.proxies]){
      if(!px.serverId){try{const j=await api("/api/proxies",{method:"POST",body:toServerSharedProxy(px)});px.serverId=j.proxy.id;delete px._dirty}catch(e){px._dirty=true}}
      else if(px._dirty){try{await api("/api/proxies/"+px.serverId,{method:"PATCH",body:toServerSharedProxy(px)});delete px._dirty}catch(e){if(!e.network)delete px._dirty}}
    }
    save();
  }finally{flushBusy=false}
}

/* ---------- DL: the sync facade the UI hooks call ---------- */
const DL={
  isSynced:()=>!!AUTH,
  chip:updateSyncChip,
  accountLabel:()=>AUTH?esc(AUTH.email)+" · Synced account":"Local mode — data stays on this device",
  bootSync(){updateSyncChip();if(AUTH&&S.session)syncFromServer()},
  enterLocal(email){AUTH=null;saveAuth();syncState="local";S.email=email;S.session={email:email,local:true};save();gate();updateSyncChip();toast("Continuing in local mode — data stays on this device")},
  localOnly(){AUTH=null;saveAuth();syncState="local";updateSyncChip()},
  signOut(){const had=!!AUTH;AUTH=null;saveAuth();syncState="local";S.session=null;save();gate();toast(had?"Signed out — local data on this device is unchanged":"Logged out")},
  async doAuth(mode,email,password,name,errEl,btn){
    const old=btn.textContent; btn.disabled=true; btn.textContent=mode==="register"?"Creating account…":"Signing in…"; errEl.classList.add("hidden");
    try{
      const j=await api(mode==="register"?"/api/auth/register":"/api/auth/login",{method:"POST",body:mode==="register"?{name:name,email:email,password:password}:{email:email,password:password}});
      AUTH={token:j.token,email:j.user.email,workspaceId:j.workspace?j.workspace.id:null,purged:loadPurged(j.user.email)};
      saveAuth(); syncState="synced";
      S.email=j.user.email; S.session={email:j.user.email}; save();
      gate(); updateSyncChip();
      toast(mode==="register"?"Account created — welcome to DevxyzLogin!":"Welcome back!");
      syncFromServer();
    }catch(e){
      errEl.textContent="⚠ "+(e.network?"Can't reach the DevxyzLogin server — check your connection, or continue in local mode":e.status===401?"Wrong email or password":e.status===409?"This email is already registered — log in instead":e.message);
      errEl.classList.remove("hidden");
    }finally{btn.disabled=false;btn.textContent=old}
  },
  async profileSaved(p,isNew,snap){
    if(!AUTH)return;
    if(isNew||!p.serverId){
      try{const j=await api("/api/profiles",{method:"POST",body:toServerProfile(p)});p.serverId=j.profile.id;delete p._dirty;save()}
      catch(e){
        if(e.network){p._dirty=true;save();setOffline();toast("Offline — profile saved locally and will sync when you are back",1)}
        else if(e.status!==401){S.profiles=S.profiles.filter(x=>x!==p);save();showPage(currentPage);toast("Server error: "+e.message+" — profile was not created",1)}
      }
      return;
    }
    try{await api("/api/profiles/"+p.serverId,{method:"PATCH",body:toServerProfile(p)});delete p._dirty;save()}
    catch(e){
      if(e.network){p._dirty=true;save();setOffline();toast("Offline — changes saved locally and will sync when you are back",1)}
      else if(e.status!==401){if(snap){const i=S.profiles.findIndex(x=>x.id===p.id);if(i>-1)S.profiles[i]=snap;save();showPage(currentPage)}toast("Server error: "+e.message+" — changes were not saved",1)}
    }
  },
  async profileCloned(src,cp){
    if(!AUTH)return;
    if(!src.serverId){cp._dirty=true;save();flushDirty();return}
    try{const j=await api("/api/profiles/"+src.serverId+"/clone",{method:"POST"});cp.serverId=j.profile.id;cp.name=j.profile.name;delete cp._dirty;save();showPage(currentPage)}
    catch(e){
      if(e.network){cp._dirty=true;save();setOffline();toast("Offline — clone saved locally and will sync when you are back",1)}
      else if(e.status!==401){S.profiles=S.profiles.filter(x=>x!==cp);save();showPage(currentPage);toast("Server error: "+e.message+" — clone was not created",1)}
    }
  },
  async profileDeleted(p){
    if(!AUTH)return;
    if(!p.serverId){p._dirty=true;save();flushDirty();return}
    try{await api("/api/profiles/"+p.serverId,{method:"DELETE"});delete p._dirty;save()}
    catch(e){
      if(e.network){p._dirty=true;save();setOffline();toast("Offline — delete saved locally and will sync when you are back",1)}
      else if(e.status!==401){const i=S.deleted.indexOf(p);if(i>-1){S.deleted.splice(i,1);delete p.deletedAt;delete p.deletedBy;S.profiles.unshift(p)}save();showPage(currentPage);toast("Server error: "+e.message+" — profile was not deleted",1)}
    }
  },
  async profileRestored(p){
    if(!AUTH)return;
    if(!p.serverId){p._dirty=true;save();flushDirty();return}
    try{await api("/api/profiles/"+p.serverId+"/restore",{method:"POST"});delete p._dirty;delete p._restorePending;save()}
    catch(e){
      if(e.network){p._dirty=true;p._restorePending=true;save();setOffline();toast("Offline — restore saved locally and will sync when you are back",1)}
      else if(e.status!==401){const i=S.profiles.indexOf(p);if(i>-1){S.profiles.splice(i,1);p.deletedAt=p.deletedAt||nowStr();p.deletedBy=S.email;S.deleted.unshift(p)}save();if(currentPage==="pa")switchPa("restore");toast("Server error: "+e.message+" — profile was not restored",1)}
    }
  },
  profilePurged(p){if(AUTH&&p.serverId){addPurged(AUTH.email,p.serverId);if(!AUTH.purged)AUTH.purged=[];if(!AUTH.purged.includes(p.serverId))AUTH.purged.push(p.serverId);saveAuth()}},
  async profileUpdated(p){
    if(!AUTH)return;
    if(!p.serverId){p._dirty=true;save();flushDirty();return}
    try{await api("/api/profiles/"+p.serverId,{method:"PATCH",body:toServerProfile(p)});delete p._dirty;save()}
    catch(e){
      if(e.network){p._dirty=true;save();setOffline()}
      else if(e.status!==401){toast("Server error: "+e.message+" — change was not synced",1);syncFromServer()}
    }
  },
  profilesUpdated(list){list.forEach(p=>DL.profileUpdated(p))},
  async folderCreated(f){
    if(!AUTH)return;
    try{const j=await api("/api/folders",{method:"POST",body:{name:f.name}});adoptFolderId(f,j.folder.id);save();showPage(currentPage)}
    catch(e){
      if(e.network){f._dirty=true;save();setOffline()}
      else if(e.status!==401){S.folders=S.folders.filter(x=>x!==f);save();showPage(currentPage);toast("Server error: "+e.message+" — folder was not created",1)}
    }
  },
  async proxySaved(rec,isEdit,snap){
    if(!AUTH)return;
    if(isEdit&&!rec.serverId){rec._dirty=true;save();flushDirty();return}
    if(isEdit){
      try{await api("/api/proxies/"+rec.serverId,{method:"PATCH",body:toServerSharedProxy(rec)});delete rec._dirty;save()}
      catch(e){
        if(e.network){rec._dirty=true;save();setOffline();toast("Offline — proxy saved locally and will sync when you are back",1)}
        else if(e.status!==401){if(snap){const i=S.proxies.findIndex(x=>x.id===rec.id);if(i>-1)S.proxies[i]=snap;save();showPage("proxies")}toast("Server error: "+e.message+" — proxy was not saved",1)}
      }
      return;
    }
    try{const j=await api("/api/proxies",{method:"POST",body:toServerSharedProxy(rec)});rec.serverId=j.proxy.id;delete rec._dirty;save()}
    catch(e){
      if(e.network){rec._dirty=true;save();setOffline();toast("Offline — proxy saved locally and will sync when you are back",1)}
      else if(e.status!==401){S.proxies=S.proxies.filter(x=>x!==rec);save();showPage("proxies");toast("Server error: "+e.message+" — proxy was not added",1)}
    }
  },
  proxiesCreated(list){list.forEach(px=>DL.proxySaved(px,false,null))},
  async proxyUpdated(px){
    if(!AUTH)return;
    if(!px.serverId){px._dirty=true;save();flushDirty();return}
    try{await api("/api/proxies/"+px.serverId,{method:"PATCH",body:toServerSharedProxy(px)});delete px._dirty;save()}
    catch(e){
      if(e.network){px._dirty=true;save();setOffline()}
      else if(e.status!==401){toast("Server error: "+e.message+" — change was not synced",1);syncFromServer()}
    }
  },
  async buyBuiltin(cat,country){
    closeModal();
    try{
      const j=await api("/api/proxies/builtin",{method:"POST",body:{country:country,type:cat.type.toLowerCase()}});
      const mapped=fromServerSharedProxy(j.proxy);
      if(!S.proxies.find(x=>x.serverId===mapped.serverId))S.proxies.push(mapped);
      save(); showPage("proxies"); toast("Built-in "+cat.type+" proxy added ("+country+")");
    }catch(e){
      if(e.status===501){openModal("Residential provider not configured",'<p class="sub-text" style="font-size:13.5px">The built-in proxy pool needs a residential provider plugged into the DevxyzLogin server (providers config on the server). Until then, buying is unavailable — but <b>Your proxy</b> works fully: add any proxy you own on this page or inside a profile, and the checker will verify it for real.</p>','<button class="btn" data-close="1">Close</button><button class="btn btn-primary" id="bcCustom">Add custom proxy</button>').querySelector("#bcCustom").onclick=()=>{closeModal();customProxyDialog()}}
      else if(e.network)toast("Offline — can't reach the server to buy a built-in proxy",1);
      else if(e.status!==401)toast("Server error: "+e.message,1);
    }
  },
  async switchWorkspace(w){
    AUTH.workspaceId=w.id; saveAuth(); S.workspace=w.name;
    S.profiles=S.profiles.filter(p=>!p.serverId); S.deleted=S.deleted.filter(p=>!p.serverId);
    S.folders=S.folders.filter(f=>!f.serverId); S.proxies=S.proxies.filter(x=>!x.serverId);
    save(); renderSidebar(); renderTopbar();
    await syncFromServer();
  },
  async createWorkspace(name){
    try{
      const j=await api("/api/workspaces",{method:"POST",body:{name:name}});
      const w={id:j.workspace.id,name:j.workspace.name}; S.workspaces.push(w); save();
      toast("Workspace created"); DL.switchWorkspace(w);
    }catch(e){
      if(e.network){S.workspaces.push({id:uid(),name:name});S.workspace=name;save();renderSidebar();renderTopbar();setOffline();toast("Offline — workspace saved locally and will be created when you are back",1)}
      else if(e.status!==401)toast("Server error: "+e.message,1);
    }
  },
  async loadTokens(){return (await api("/api/tokens")).tokens||[]},
  async createToken(name){return api("/api/tokens",{method:"POST",body:{name:name}})},
  async deleteToken(id){return api("/api/tokens/"+encodeURIComponent(id),{method:"DELETE"})}
};
window.DL=DL;
updateSyncChip();
if(AUTH&&S.session)syncFromServer();
</script>
