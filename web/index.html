<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevxyzLogin</title>
<style>
:root{
  --accent:#0FBECA; --accent2:#00A987; --link:#14AAB8; --addbtn:#0FBECA;
  --bg:#FFFFFF; --sidebar:#FAFAFA; --card:#FFFFFF; --ink:#111827; --muted:#6B7280;
  --line:#E5E7EB; --chip:#F1F5F9; --hover:#F1F5F9; --selopt:#E7F6F1; --summary:#F7F7F7;
  --plancard:#E4EFFD; --banner:#DEF6FF; --submenu:#FFFFFF; --danger:#E5534B; --danger-ink:#D92D20;
  --green:#00A987; --blue:#2E7CF6; --orange:#E8930C; --input:#FFFFFF; --modal:#FFFFFF;
  --shadow:0 8px 30px rgba(16,24,40,.14);
}
[data-theme="dark"]{
  --bg:#1E1F2B; --sidebar:#191A24; --card:#23242F; --ink:#F3F4F6; --muted:#9CA3AF;
  --line:#2E2F3D; --chip:#26273A; --hover:#26273A; --selopt:#123B35; --summary:#23242F;
  --plancard:#132C58; --banner:#2C2D3D; --submenu:#1E1E2B; --input:#23242F; --modal:#23242F;
  --addbtn:#008D57; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--link);text-decoration:none;cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c8ccd4;border-radius:5px}[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3a3b4d}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:250px;flex:0 0 250px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:56px;background:var(--sidebar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:40}
#content{padding:18px 22px 40px;flex:1}
.crumb{font-size:14px}.crumb b{font-weight:600}.crumb span{color:var(--muted)}
.top-pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.top-pill:hover{border-color:var(--accent2)}
.avatar-btn{margin-left:2px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.avatar-sq{width:26px;height:26px;border-radius:7px;background:var(--accent2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.avatar-rd{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

/* ---------- sidebar ---------- */
.ws-switch{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;width:100%;background:none;border:none;text-align:left;color:var(--ink)}
.ws-switch:hover{background:var(--hover)}
.ws-switch .ws-name{font-weight:600;font-size:14.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-split{display:flex;margin:12px 0 14px;border-radius:9px;overflow:hidden}
.add-main{flex:1;background:var(--addbtn);color:#fff;border:none;height:38px;font-size:14.5px;font-weight:600}
.add-chev{width:34px;background:var(--accent2);color:#fff;border:none;font-size:12px}
[data-theme="dark"] .add-chev{background:#00754A}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;background:none;border-radius:8px;font-size:14px;color:var(--ink);text-align:left;margin-bottom:2px}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--chip);font-weight:600}
.nav-ico{width:19px;text-align:center;font-size:15px;flex:0 0 19px}
.nav-badge{margin-left:auto;color:var(--orange);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.promo-card{background:#F9F9F9;border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:auto;position:relative}
[data-theme="dark"] .promo-card{background:#08090C}
.promo-card .x{position:absolute;top:6px;right:8px;border:none;background:none;color:var(--muted);font-size:13px}
.promo-card b{font-size:13.5px;display:block;margin-bottom:3px;padding-right:14px}
.promo-card p{font-size:12.5px;color:var(--muted)}
.plan-card{background:var(--plancard);border-radius:12px;padding:13px;margin-top:10px}
.plan-card .row{display:flex;justify-content:space-between;align-items:center}
.plan-card .bar{height:5px;border-radius:3px;background:rgba(120,140,170,.35);margin:9px 0 6px;overflow:hidden}
.plan-card .bar i{display:block;height:100%;background:var(--accent2)}
.plan-card small{color:var(--muted);font-size:12.5px}
.side-link{display:flex;gap:10px;align-items:center;width:100%;background:none;border:none;padding:8px 10px;font-size:14px;color:var(--ink);border-radius:8px;text-align:left}
.side-link:hover{background:var(--hover)}

/* ---------- generic controls ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;height:36px;padding:0 15px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--accent2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-green{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn-outline-green{background:var(--card);border-color:var(--accent2);color:var(--accent2)}
.btn-danger-o{background:var(--card);border-color:var(--danger);color:var(--danger-ink)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{height:30px;padding:0 11px;font-size:13px}
.icon-btn{border:1px solid transparent;background:none;border-radius:8px;width:34px;height:34px;font-size:16px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--hover)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--input);border-radius:8px;height:40px;padding:0 11px;width:100%}
textarea.input{height:auto;padding:9px 11px;resize:vertical}
.input:focus{outline:2px solid rgba(15,190,202,.35);border-color:var(--accent)}
.label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.field{margin-bottom:14px}
.sub-text{color:var(--muted);font-size:12.5px}
.switch{position:relative;width:36px;height:20px;flex:0 0 36px;display:inline-block;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:#C6CBD4;border-radius:999px;transition:.15s;cursor:pointer}
.switch .tr:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.switch input:checked + .tr{background:var(--accent2)}
.switch input:checked + .tr:before{transform:translateX(16px)}
.switch input:disabled + .tr{opacity:.5}
.seg{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:500}
.seg button.sel{border-color:var(--accent2);color:var(--accent2);background:var(--selopt)}
.seg-cards button{border-radius:10px;padding:11px 18px;font-size:14px}
.radio-pill{display:inline-flex;gap:8px;flex-wrap:wrap}
.radio-pill button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;font-size:13.5px}
.radio-pill button.sel{border-color:var(--accent2);color:var(--accent2);background:var(--selopt)}
.checkbox{width:18px;height:18px;border:1.5px solid #B9BFCB;border-radius:4px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;cursor:pointer;flex:0 0 18px}
.checkbox.on{background:var(--accent2);border-color:var(--accent2)}
.stepper{display:inline-flex;align-items:center;gap:2px}
.stepper button{width:26px;height:26px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:15px;color:var(--ink)}
.stepper input{width:44px;text-align:center;border:1px solid var(--line);border-radius:7px;height:26px;background:var(--input)}
.code-block{background:var(--summary);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;white-space:pre-wrap}
.spinner{width:34px;height:34px;border:3.5px solid var(--chip);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
.spinner.sm{width:16px;height:16px;border-width:2.5px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
.page-loader{padding:90px 0;text-align:center}

/* ---------- banner / toolbar / table ---------- */
#trialBanner{background:var(--banner);text-align:center;padding:8px;font-size:13.5px}
#trialBanner a{font-weight:600}
.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.dark-pill{background:#3C4048;color:#fff;border:none;border-radius:999px;padding:8px 16px;font-weight:600;font-size:13.5px}
[data-theme="dark"] .dark-pill{background:#E5E7EB;color:#111827}
.tbl-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--card)}
table.tbl{border-collapse:collapse;width:100%;min-width:760px}
.tbl th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px;white-space:nowrap}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr.selrow{background:var(--chip)}
.pname{font-weight:600;cursor:text}
.pname:hover{text-decoration:underline}
.run-pill{border:1.5px solid var(--accent2);color:#37ACB0;background:var(--card);border-radius:999px;min-width:56px;height:30px;font-weight:600;font-size:13px;padding:0 12px}
.run-pill:hover{background:var(--accent2);color:#fff}
.view-pill{border:1.5px solid var(--accent2);color:var(--accent2);background:var(--card);border-radius:999px;height:30px;font-weight:600;font-size:13px;padding:0 14px}
.view-pill:hover{background:var(--accent2);color:#fff}
.stop-pill{border:1.5px solid var(--danger);color:var(--danger-ink);background:var(--card);border-radius:999px;height:30px;font-weight:600;font-size:13px;padding:0 14px;margin-left:6px}
.state-cell{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.dot.ready{border:2px solid #B9BFCB;background:transparent}
.dot.running{background:var(--accent2)}
.dot.busy{background:var(--blue)}
.dot.err{background:var(--danger)}
.state-busy{color:var(--blue)}
.tag-chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;color:#fff;margin-right:4px}
.loc-input{border:none;background:transparent;font-size:13px;width:150px;color:var(--muted)}
.loc-input:focus{outline:none;color:var(--ink)}
.inline-input{border:1.5px solid var(--accent);border-radius:6px;height:30px;padding:0 8px;font-size:13.5px;background:var(--input)}
.settings-link{color:var(--accent2);font-size:12.5px;font-weight:600;visibility:hidden;white-space:nowrap}
tr:hover .settings-link{visibility:visible}
.row-check{visibility:hidden}
tr:hover .row-check,.row-check.on{visibility:visible}

/* ---------- bulk bar ---------- */
#bulkBar{display:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--card)}
#bulkBar.show{display:block}
.bulk-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
.bulk-row:first-child{margin-top:0}
.bulk-btn{border:1px solid var(--line);background:var(--chip);border-radius:999px;height:28px;padding:0 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.bulk-btn:hover{border-color:var(--accent2)}

/* ---------- menus / popovers ---------- */
.menu{position:absolute;background:var(--modal);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:200;min-width:230px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:8px 10px;border-radius:7px;font-size:13.5px;color:var(--ink);text-align:left;min-height:34px}
.menu button:hover:not([disabled]){background:var(--hover)}
.menu button[disabled]{opacity:.45;cursor:not-allowed}
.menu .mi{width:17px;text-align:center;flex:0 0 17px}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .mhead{padding:8px 10px 4px;font-weight:700;font-size:14px}
.menu .msub{padding:0 10px 6px;color:var(--muted);font-size:12.5px}

/* ---------- modals ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,18,28,.45);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.modal{background:var(--modal);border-radius:14px;width:520px;max-width:100%;box-shadow:var(--shadow)}
.modal.wide{width:760px}
.modal-head{display:flex;align-items:center;padding:16px 20px 0}
.modal-title{font-size:17px;font-weight:700}
.modal-body{padding:14px 20px}
.modal-foot{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:9px}

/* ---------- drawer ---------- */
#drawerWrap{position:fixed;inset:0;z-index:250;display:none}
#drawerWrap.show{display:block}
#drawerShade{position:absolute;inset:0;background:rgba(15,18,28,.28)}
#drawer{position:absolute;top:0;right:0;bottom:0;width:530px;max-width:94vw;background:var(--modal);box-shadow:var(--shadow);overflow-y:auto;padding:18px 20px}
.qs-head-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;background:var(--summary)}
.qs-bar{background:var(--chip);border-radius:9px;padding:9px 12px;margin:14px 0 6px}
.qs-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.qs-row .ql{width:130px;flex:0 0 130px;color:var(--muted);font-size:13px}
.qs-row .qv{flex:1;min-width:0}
.qs-sec{border-bottom:1px solid var(--line)}
.qs-sec-head{width:100%;background:none;border:none;display:flex;justify-content:space-between;padding:13px 2px;font-size:14.5px;font-weight:600;color:var(--ink)}
.drag{color:var(--muted);cursor:grab;font-size:13px}

/* ---------- editor ---------- */
#editorOverlay{position:fixed;inset:0;background:var(--bg);z-index:220;overflow-y:auto}
.ed-wrap{max-width:1180px;margin:0 auto;padding:16px 22px 110px}
.ed-head h1{font-size:24px;font-weight:700;margin:4px 0 14px}
.ed-grid{display:flex;gap:22px;align-items:flex-start}
.ed-main{flex:1;min-width:0}
.ed-summary{width:300px;flex:0 0 300px;background:var(--summary);border-radius:12px;padding:16px;position:sticky;top:14px}
.ed-summary h3{font-size:15px;margin-bottom:10px}
.sum-row{display:flex;gap:8px;font-size:12.5px;padding:4.5px 0;border-bottom:1px dashed var(--line)}
.sum-row .sl{color:var(--muted);flex:0 0 108px}
.sum-row .sv{word-break:break-all}
.ed-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 18px;overflow-x:auto}
.ed-tab{border:none;background:none;padding:9px 13px;font-size:14px;color:var(--ink);white-space:nowrap;border-bottom:2px solid transparent}
.ed-tab.sel{color:var(--accent2);border-bottom-color:var(--accent2);font-weight:600}
.ed-sec{font-size:16px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:7px}
.info-i{color:var(--muted);font-size:13px;cursor:help}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 22px;z-index:230}
.sticky-bar .in{max-width:1180px;margin:0 auto}
.benefit-card{background:var(--summary);border-radius:12px;padding:15px;margin:12px 0}
.benefit-card li{list-style:none;padding:4px 0;font-size:13.5px}
.benefit-card li:before{content:"✓";color:var(--accent2);font-weight:700;margin-right:8px}
.combo{position:relative}
.combo-list{position:absolute;top:44px;left:0;right:0;background:var(--modal);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow-y:auto;z-index:60;padding:5px}
.combo-list button{display:flex;gap:9px;align-items:center;width:100%;border:none;background:none;padding:8px 10px;border-radius:7px;font-size:13.5px;color:var(--ink);text-align:left}
.combo-list button:hover,.combo-list button.sel{background:var(--selopt)}
.combo-more{padding:8px 10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}

/* ---------- cards / proxies ---------- */
.px-tabs{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.px-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.px-card{border-radius:12px;padding:20px 24px;position:relative;border:1px solid var(--line)}
.px-card h3{font-size:16.5px;margin-bottom:5px;padding-right:40px}
.px-card p{font-size:13px;color:var(--muted);margin-top:5px}
.px-card .act{font-weight:600;font-size:13.5px}
.px-card .circ{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:16px}
[data-theme="dark"] .px-card .circ{background:rgba(255,255,255,.12)}
.pill-connected{display:inline-flex;align-items:center;gap:6px;background:#E7F6F1;color:#047857;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
[data-theme="dark"] .pill-connected{background:#123B35;color:#4ADE80}
.qr-box{width:150px;height:150px;margin:10px auto;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);border:6px solid #fff;outline:1px solid var(--line)}
.qr-box i{background:#fff}.qr-box i.b{background:#111}

/* ---------- personal area ---------- */
.pa-wrap{display:flex;gap:0;align-items:flex-start}
.pa-menu{width:250px;flex:0 0 250px;background:var(--submenu);border-right:1px solid var(--line);border-radius:12px;margin-right:22px;padding:10px 0;overflow:hidden}
.pa-menu .pm-head{padding:10px 16px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pa-item{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 16px;font-size:14px;color:var(--ink);border-right:3px solid transparent}
.pa-item:hover{background:var(--hover)}
.pa-item.sel{background:var(--selopt);border-right-color:#0D8478;font-weight:600}
.pa-sec{padding:12px 16px 4px;font-size:12px;color:var(--muted);text-transform:none;font-weight:600}
.pa-main{flex:1;min-width:0}
.pa-main h1{font-size:22px;font-weight:700;margin-bottom:16px}
.kv-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv-row .kl{width:230px;flex:0 0 230px;font-size:14px}
.kv-row .kv{flex:1;min-width:0}
.stat-cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.stat-card{background:var(--summary);border-radius:12px;padding:15px 18px;min-width:150px;flex:1}
.stat-card .sv2{font-size:24px;font-weight:700}
.stat-card .sl2{font-size:13px;color:var(--muted)}
.progress{height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent2)}

/* ---------- pricing ---------- */
.bill-toggle{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px;margin-bottom:20px}
.bill-toggle button{border:none;background:none;padding:8px 18px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink)}
.bill-toggle button.sel{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.plan-pick{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--card);position:relative}
.plan-pick.dark{background:#2B2F36;color:#fff;border-color:#2B2F36}
.plan-pick .price{font-size:27px;font-weight:800}
.plan-pick .price s{font-size:15px;color:var(--muted);font-weight:500}
.plan-pick .cnt{display:flex;gap:6px;margin:10px 0}
.plan-pick .cnt button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--ink)}
.plan-pick .cnt button.sel{border-color:var(--accent2);color:var(--accent2);background:var(--selopt)}
.popular{position:absolute;top:-11px;left:16px;background:var(--accent2);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px}

/* ---------- AI / accounts ---------- */
.iframe-shell{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:560px;background:var(--card)}
.if-side{width:250px;flex:0 0 250px;border-right:1px solid var(--line);padding:14px 12px;background:var(--card)}
.if-main{flex:1;padding:26px;min-width:0}
.if-sec{font-size:12px;color:var(--muted);font-weight:600;margin:16px 2px 6px}
.if-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--ink);text-align:left}
.if-item.sel{background:var(--chip);font-weight:600}
.badge-n{margin-left:auto;background:#1F2430;color:#fff;border-radius:50%;width:19px;height:19px;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
[data-theme="dark"] .badge-n{background:#E5E7EB;color:#111}
.sugg-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.sugg-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:230px;background:var(--card);text-align:left}
.sugg-card:hover{border-color:var(--accent2)}
.big-num{font-size:44px;font-weight:800;color:#BFE9DC;line-height:1}
[data-theme="dark"] .big-num{color:#175E4C}

/* ---------- console ---------- */
.console-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.log-panel{background:#101219;color:#C9E7C9;border-radius:10px;padding:13px 15px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;height:190px;overflow-y:auto;white-space:pre-wrap}
.log-panel .err{color:#FF8A80}
.preview-box{border:1px solid var(--line);border-radius:10px;min-height:230px;background:#0B0C10;color:#9CA3AF;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}

/* ---------- login ---------- */
#loginView{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex}
.login-left{flex:1.2;display:flex;align-items:center;justify-content:center;padding:20px}
.login-form{width:360px;max-width:94vw}
.login-right{flex:1;background:var(--sidebar);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:var(--muted)}
.favi-row{display:flex;gap:12px;font-size:24px}
.mock-browser{width:78%;max-width:430px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px;box-shadow:var(--shadow)}
.or-div{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:16px 0}
.or-div:before,.or-div:after{content:"";flex:1;height:1px;background:var(--line)}
.eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:15px;color:var(--muted)}
.pw-wrap{position:relative}
.pw-wrap .ok-check{position:absolute;right:36px;top:50%;transform:translateY(-50%);color:var(--accent2);font-weight:700}
.login-err{color:var(--danger-ink);font-size:12.5px;margin-top:5px}

/* ---------- misc ---------- */
#toastWrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1F2430;color:#fff;border-radius:9px;padding:10px 16px;font-size:13.5px;box-shadow:var(--shadow)}
.toast.err{background:#7A271F}
#intercomBtn{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;background:var(--accent2);color:#fff;border:none;font-size:22px;z-index:90;box-shadow:var(--shadow)}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .big-ico{font-size:52px;opacity:.45}
.empty-state h2{font-size:21px;color:#C3C9D4;font-weight:600;margin:10px 0 14px}
.search-pop{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--card)}
.search-pop input{border:none;height:36px;background:none;width:170px}
.search-pop input:focus{outline:none}
.chat-log{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto;padding:6px 2px}
.chat-msg{max-width:78%;padding:10px 13px;border-radius:13px;font-size:13.5px;white-space:pre-wrap}
.chat-msg.bot{background:var(--chip);align-self:flex-start}
.chat-msg.me{background:var(--accent2);color:#fff;align-self:flex-end}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lang-list{border:1px solid var(--line);border-radius:10px;height:300px;overflow-y:auto;padding:6px}
.lang-row{display:flex;gap:9px;align-items:center;width:100%;border:none;background:none;padding:7px 9px;border-radius:7px;font-size:13.5px;color:var(--ink);text-align:left}
.lang-row:hover{background:var(--hover)}
.sel-lang-row{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-bottom:8px;background:var(--card)}
@media (max-width:900px){#sidebar{display:none}#topbar .top-pill{display:none}.px-grid{grid-template-columns:1fr}.plan-grid{grid-template-columns:1fr 1fr}.ed-grid{flex-direction:column}.ed-summary{width:100%;flex:none}.two-col{grid-template-columns:1fr}.login-right{display:none}}
</style>
</head>

function openWorkspaceMenu(anchor){

    '<div style="display:flex;gap:10px;align-items:center;padding:8px 10px"><span class="avatar-sq">'+esc((S.workspace||"M")[0].toUpperCase())+'</span><div><b>'+esc(S.workspace)+'</b><div class="sub-text">Forever Free · '+used+' of 3 profiles</div></div><a style="margin-left:auto" id="wsUpgrade">Upgrade plan</a></div>'

    +'<div class="sep"></div>'

    +'<button id="wsAdd">➕ Add workspace</button><div class="sep"></div><button id="wsLogout" style="color:var(--danger-ink)">⎋ Logout</button>',300);
  m.querySelector("#wsUpgrade").onclick=()=>{closeMenus();showPage("pa");switchPa("billing")};
  m.querySelector("#wsSettings").onclick=()=>{closeMenus();showPage("pa");switchPa("members")};
  m.querySelector("#wsAll").onclick=()=>{closeMenus();toast(S.workspaces.length+" workspace(s)")};
  m.querySelectorAll("[data-ws]").forEach(b=>b.onclick=()=>{const w=S.workspaces.find(x=>x.id===b.dataset.ws);if(w){if(window.DL&&DL.isSynced())DL.switchWorkspace(w);else{S.workspace=w.name;save();renderSidebar();renderTopbar()}}closeMenus()});
  m.querySelector("#wsAdd").onclick=async()=>{closeMenus();const n=await promptDialog("Add workspace","Workspace name","","Create");if(n&&n.trim()){if(window.DL&&DL.isSynced())DL.createWorkspace(n.trim());else{S.workspaces.push({id:uid(),name:n.trim()});S.workspace=n.trim();save();renderSidebar();renderTopbar();toast("Workspace created")}}};
  m.querySelector("#wsLogout").onclick=()=>{closeMenus();if(window.DL)DL.signOut();else{S.session=null;save();gate()}};
}
const PAGE_TITLES={profiles:"All profiles",accounts:"Accounts",proxies:"Proxies",ai:"AI Assistant",pa:"API",cloud:"Cloud Android",console:"Dashboard"};
function renderTopbar(){
  $("#topbar").innerHTML='<div class="crumb"><b>'+esc(S.workspace)+'</b> <span>›</span> <span>'+esc(PAGE_TITLES[currentPage]||"All profiles")+'</span></div>'
   +'<div style="margin-left:auto;display:flex;gap:9px;align-items:center">'
   +'<button class="top-pill" id="installBtn">⇩ Install App</button>'
   +'<button class="top-pill" id="inviteBtn">🎁 Invite and get 150$</button>'
   +'<span id="syncChip" title="Sync status" style="font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap"></span>'
   +'<button class="avatar-btn" id="avatarBtn"><span class="avatar-rd">'+esc((S.email||"D")[0].toUpperCase())+'</span>'+esc(S.workspace)+'</button></div>';
  if(window.DL)DL.chip();
  $("#installBtn").onclick=()=>toast("DevxyzLogin desktop app — coming with the desktop release. The web dashboard works in any browser.");
  $("#inviteBtn").onclick=()=>{showPage("pa");switchPa("affiliate")};
  $("#avatarBtn").onclick=e=>{e.stopPropagation();openWorkspaceMenu(e.currentTarget)};

$("#payNowLink").onclick=()=>{showPage("pa");switchPa("billing")};
$("#intercomBtn").onclick=()=>openModal("Support",'<p class="sub-text" style="font-size:13.5px">DevxyzLogin support replies within a day. For urgent issues include your profile ID (3-dots menu → Copy ID).</p>','<button class="btn btn-primary" data-close="1">OK</button>');

function showPage(page){
  currentPage=page;

/* ================= sign-in (capture §2) ================= */
function gate(){
  if(S.session){$("#loginView").classList.add("hidden");$("#app").classList.remove("hidden");applyTheme();renderSidebar();renderTopbar();showPage(currentPage);if(window.DL)DL.bootSync()}
  else{$("#app").classList.add("hidden");renderLogin()}
}
function renderLogin(){
  const lv=$("#loginView"); lv.classList.remove("hidden");
  let step=1, mode="login";
  lv.innerHTML='<div class="login-left"><div class="login-form">'
   +'<h1 style="font-size:26px;margin-bottom:6px">👋 Welcome!</h1>'
   +'<p class="sub-text" style="font-size:14px;margin-bottom:20px" id="loginSub">Welcome back! Please log in to your account.</p>'
   +'<button class="btn" id="googleBtn" style="width:100%;border-color:var(--accent2);color:var(--accent2);font-weight:600"><b style="font-size:16px">G</b> Continue with Google</button>'
   +'<div class="or-div">OR</div>'
   +'<div class="field"><label class="label">Your email</label><div class="pw-wrap"><input class="input" id="loginEmail" placeholder="Your email" value="'+esc(S.email||"")+'"><span class="ok-check hidden" id="emailOk">✓</span></div></div>'
   +'<div class="field hidden" id="nameField"><label class="label">Your name</label><input class="input" id="loginName" placeholder="Your name"></div>'
   +'<div class="field hidden" id="pwField"><label class="label">Password</label><div class="pw-wrap"><input class="input" id="loginPw" type="password" placeholder="Password"><button class="eye-btn" id="pwEye" type="button">👁</button></div><div class="login-err hidden" id="loginErr">⚠ Wrong email or password</div></div>'
   +'<button class="btn btn-green" id="loginBtn" style="width:100%" disabled>Log in</button>'
   +'<div style="display:flex;justify-content:space-between;margin-top:16px"><a id="modeLink" style="color:var(--ink)">Create an account</a><a id="forgotLink" style="color:var(--ink)">Forgot password?</a></div>'
   +'<div style="margin-top:14px;text-align:center"><a id="localModeLink" style="color:var(--muted);font-size:13px">Continue in local mode →</a></div>'
   +'<div class="sub-text" style="margin-top:34px"><a style="color:var(--muted)">Terms of use</a> &nbsp; <a style="color:var(--muted)">Privacy policy</a></div>'
   +'</div></div>'
   +'<div class="login-right"><div class="favi-row"><span>🌐</span><span>📘</span><span>▶️</span><span>📷</span><span>🐦</span><span>💼</span></div>'
   +'<div class="mock-browser"><div style="display:flex;gap:6px;margin-bottom:12px"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span></div>'
   +'<div style="font-weight:700;font-size:17px;color:var(--ink)">DevxyzLogin</div><p style="font-size:13px;margin-top:5px">Browser for Managing Multiple Accounts — every profile gets its own fingerprint, proxy and session.</p></div>'
   +'<div style="font-size:30px">✏️</div></div>';
  const emailInp=lv.querySelector("#loginEmail"), pwInp=lv.querySelector("#loginPw"), btn=lv.querySelector("#loginBtn");
  emailInp.oninput=()=>{const ok=/.+@.+\..+/.test(emailInp.value);lv.querySelector("#emailOk").classList.toggle("hidden",!ok);btn.disabled=!(ok&&(step===1||pwInp.value.length>=1))};
  pwInp.oninput=()=>{btn.disabled=!(pwInp.value.length>=1)};
  lv.querySelector("#pwEye").onclick=()=>{pwInp.type=pwInp.type==="password"?"text":"password"};
  lv.querySelector("#googleBtn").onclick=()=>{if(window.DL)DL.localOnly();S.session={email:S.email||"devxyz@local",local:true};save();gate();toast("Signed in with Google (local demo)")};
  lv.querySelector("#modeLink").onclick=()=>{mode=mode==="login"?"register":"login";lv.querySelector("#loginSub").textContent=mode==="register"?"Create your DevxyzLogin account.":"Welcome back! Please log in to your account.";btn.textContent=mode==="register"?"Create account":"Log in";lv.querySelector("#modeLink").textContent=mode==="register"?"Log in instead":"Create an account";lv.querySelector("#nameField").classList.toggle("hidden",mode!=="register");lv.querySelector("#loginErr").classList.add("hidden")};
  lv.querySelector("#forgotLink").onclick=()=>toast("Password reset is not available yet — server accounts use the password set at sign-up",1);
  lv.querySelector("#localModeLink").onclick=()=>{const em=emailInp.value.trim();DL.enterLocal(em||S.email||"devxyz@local")};
  btn.onclick=()=>{
    if(step===1){step=2;lv.querySelector("#pwField").classList.remove("hidden");btn.disabled=pwInp.value.length<1;pwInp.focus();return}
    const em=emailInp.value.trim(), pw=pwInp.value;
    const nameEl=lv.querySelector("#loginName");
    DL.doAuth(mode,em,pw,nameEl?nameEl.value.trim():"",lv.querySelector("#loginErr"),btn);
  };
}
</script>

<script>
/* ================= profiles list ================= */
const COL_DEFS=[
 ["name","Name",null],["state","State","state"],["notes","Notes","notes"],["lastUpdate","Last Update","lastUpdate"],
 ["lastLaunch","Last Launch","lastLaunch"],["created","Created","created"],["proxyType","Proxy Type","proxyType"],
 ["proxyLoc","Proxy & Location","proxyLoc"],["proxyPort","Proxy Port","proxyPort"],["proxyUser","Proxy Username","proxyUser"],
 ["proxyPass","Proxy Password","proxyPass"],["os","OS","os"],["browserVersion","Browser Version","browserVersion"],
 ["sharing","Sharing","sharing"],["tags","Tags","tags"]];
let profSort={key:"",dir:1}, profQuery="", cloudMode=false;
function visibleCols(){return COL_DEFS.filter(c=>!c[2]||S.columns[c[2]])}
function stateCell(p){
  const r=runMap[p.id];
  if(r&&r.phase==="downloading")return '<span class="state-cell"><span class="dot busy"></span><span class="state-busy">downloading profile...</span></span>';
  if(r&&r.phase==="syncing")return '<span class="state-cell"><span class="dot busy"></span><span class="state-busy">syncing</span></span>';
  if(p.state==="running")return '<span class="state-cell"><span class="dot running"></span>running</span>';
  return '<span class="state-cell"><span class="dot ready"></span><span style="color:var(--muted)">ready</span></span>';
}
function runCell(p){
  const r=runMap[p.id];
  if(r&&(r.phase==="downloading"||r.phase==="syncing"))return '<span class="spinner sm" style="display:inline-block;vertical-align:middle"></span>';
  if(p.state==="running")return '<button class="view-pill" data-view="'+p.id+'">View</button><button class="stop-pill" data-stop="'+p.id+'">Stop</button>';
  return '<button class="run-pill" data-run="'+p.id+'">Run</button><button class="icon-btn" data-menu="'+p.id+'" title="More">…</button>';
}
function cellVal(p,key){
  switch(key){
    case "state":return stateCell(p);
    case "notes":return p.notes?esc(p.notes):'<a data-note="'+p.id+'" style="color:var(--muted)">Add note</a>';
    case "lastUpdate":return esc(p.lastUpdate||"");
    case "lastLaunch":return esc(p.lastLaunch||"");
    case "created":return esc(p.createdAt||"");
    case "proxyType":return profProxyTypeLabel(p);
    case "proxyLoc":return '<span style="display:inline-flex;align-items:center;gap:6px">'+(profConnected(p)?'<span class="dot running" style="width:8px;height:8px"></span>':"")+profProxyLoc(p)+'</span> <input class="loc-input" placeholder="Search for location..." data-loc="'+p.id+'">';
    case "proxyPort":return esc(proxyPortOf(p));
    case "proxyUser":return esc(trunc(proxyUserOf(p)));
    case "proxyPass":return esc(trunc(proxyPassOf(p)));
    case "os":return esc(p.fp.os);
    case "browserVersion":return esc(p.fp.browserVersion);
    case "sharing":return '<span class="sub-text">Not shared</span>';
    case "tags":return p.tags.map(t=>'<span class="tag-chip" style="background:'+t.color+'">'+esc(t.text)+'</span>').join("");
  }
  return "";
}
function trunc(s){s=String(s||"");return s.length>10?s.slice(0,10)+"…":s}
function profConnected(p){return p.state==="running"||!!(p.proxy&&p.proxy.ip)}
function proxyPortOf(p){if(p.proxy&&p.proxy.proxyId){const px=S.proxies.find(x=>x.id===p.proxy.proxyId);if(px)return px.port}return (p.proxy&&p.proxy.port)||(p.proxy&&p.proxy.mode==="builtin"?"10080":"")}
function proxyUserOf(p){if(p.proxy&&p.proxy.proxyId){const px=S.proxies.find(x=>x.id===p.proxy.proxyId);if(px)return px.login}return (p.proxy&&p.proxy.login)||""}
function proxyPassOf(p){if(p.proxy&&p.proxy.proxyId){const px=S.proxies.find(x=>x.id===p.proxy.proxyId);if(px)return px.password}return (p.proxy&&p.proxy.password)||""}
function filteredProfiles(cloud){
  let list=S.profiles.filter(p=>!!p.cloudAndroid===!!cloud);
  if(!cloud&&activeFolder)list=list.filter(p=>(p.folderIds||[]).includes(activeFolder)||p.folderId===activeFolder);
  if(profQuery)list=list.filter(p=>(p.name+" "+(p.notes||"")).toLowerCase().includes(profQuery.toLowerCase()));
  list.sort((a,b)=>{if(a.pinned!==b.pinned)return a.pinned?-1:1;
    if(profSort.key){let x=a[profSort.key]||"",y=b[profSort.key]||"";if(profSort.key==="created")return (new Date(x)-new Date(y))*profSort.dir;return String(x).localeCompare(String(y))*profSort.dir}
    return 0});
  return list;
}
function renderProfiles(c){
  cloudMode=false;
  const list=filteredProfiles(false);
  const cols=visibleCols();
  const fname=activeFolder?(S.folders.find(f=>f.id===activeFolder)||{}).name:"All profiles";
  c.innerHTML=
   '<div class="toolbar"><button class="icon-btn" id="searchBtn" title="Search">🔍</button><span class="search-pop hidden" id="searchPop">🔍<input id="profSearch" placeholder="Search profiles..." value="'+esc(profQuery)+'"></span>'
  +' <button class="dark-pill" id="folderPill">'+esc(fname)+'</button><button class="icon-btn" id="foldersBtn" title="Folders">…</button>'
  +' <span style="flex:1"></span><button class="icon-btn" id="colsBtn" title="Column Settings">🎛</button></div>'
  +'<div id="bulkBar"></div>'
  +'<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:30px"><span class="checkbox" id="checkAll"></span></th>'
  + cols.map(col=>'<th data-sort="'+col[0]+'" style="cursor:pointer">'+col[1]+(col[0]==="name"?' <span title="Add column">＋</span>':"")+' <span style="font-size:10px;color:var(--muted)">⇅</span></th>').join("")
  +'</tr></thead><tbody id="profileRows">'
  + (list.length?list.map(p=>profileRow(p,cols)).join(""):'<tr><td colspan="'+(cols.length+1)+'"><div class="empty-state"><div class="big-ico">🗂</div><h2>No profiles yet</h2><button class="btn btn-outline-green" id="emptyAdd">+ Add profile</button></div></td></tr>')
  +'</tbody></table></div>'
  +'<p class="sub-text" style="margin-top:10px">'+list.length+' profile(s) · Local simulation: Run applies the fingerprint in a preview panel. Connect the DevxyzLogin server in Settings → API for cloud sync.</p>';
  wireProfiles(c,false);
}
function profileRow(p,cols){
  return '<tr data-row="'+p.id+'" class="'+(selected.has(p.id)?"selrow":"")+'"><td><span style="color:var(--muted);cursor:grab">⠿</span> <span class="checkbox row-check'+(selected.has(p.id)?" on":"")+'" data-check="'+p.id+'">'+(selected.has(p.id)?"✓":"")+'</span></td>'
   + cols.map(col=>{
      if(col[0]==="name")return '<td><span class="pname" data-inline-name="'+p.id+'" title="Click to rename">'+esc(p.name)+'</span>'+(p.pinned?' 📌':"")+' <a class="settings-link" data-quick="'+p.id+'" title="Open quick profile settings">Settings ›</a><div>'+runCell(p)+'</div></td>';
      return '<td>'+cellVal(p,col[0])+'</td>';
   }).join("")+'</tr>';
}
function wireProfiles(c,cloud){
  const q=c.querySelector("#profSearch");
  c.querySelector("#searchBtn").onclick=()=>{const pop=c.querySelector("#searchPop");pop.classList.toggle("hidden");const i=c.querySelector("#profSearch");if(i)i.focus()};
  if(q)q.oninput=()=>{profQuery=q.value;const tb=c.querySelector("#profileRows");refreshRows(c,cloud)};
  c.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{const k=th.dataset.sort==="name"?"name":th.dataset.sort;profSort={key:k==="created"?"createdAt":k,dir:profSort.key===(k==="created"?"createdAt":k)?-profSort.dir:1};refreshRows(c,cloud);renderBulk(c,cloud)});
  const ca=c.querySelector("#checkAll");
  if(ca)ca.onclick=()=>{const list=filteredProfiles(cloud);const all=list.every(p=>selected.has(p.id));list.forEach(p=>all?selected.delete(p.id):selected.add(p.id));refreshRows(c,cloud);renderBulk(c,cloud)};
  const ea=c.querySelector("#emptyAdd"); if(ea)ea.onclick=()=>openEditor(null,cloud);
  const fb=c.querySelector("#foldersBtn"); if(fb)fb.onclick=e=>{e.stopPropagation();openFoldersMenu(e.currentTarget)};
  const fp=c.querySelector("#folderPill"); if(fp)fp.onclick=e=>{e.stopPropagation();openFoldersMenu(e.currentTarget)};
  const cb=c.querySelector("#colsBtn"); if(cb)cb.onclick=e=>{e.stopPropagation();openColumnsPop(e.currentTarget,c,cloud)};
  refreshRows(c,cloud); renderBulk(c,cloud);
}
function refreshRows(c,cloud){
  const tb=c.querySelector("#profileRows"); if(!tb)return;
  const list=filteredProfiles(cloud), cols=visibleCols();
  tb.innerHTML=list.length?list.map(p=>profileRow(p,cols)).join(""):'<tr><td colspan="'+(cols.length+1)+'"><div class="empty-state"><div class="big-ico">🗂</div><h2>No profiles yet</h2></div></td></tr>';
  tb.querySelectorAll("[data-check]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.check;selected.has(id)?selected.delete(id):selected.add(id);refreshRows(c,cloud);renderBulk(c,cloud)});
  tb.querySelectorAll("[data-run]").forEach(b=>b.onclick=e=>{e.stopPropagation();openRunMenu(b.dataset.run,b)});
  tb.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>stopProfile(b.dataset.stop,c,cloud));
  tb.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>openSessionPanel(findProfile(b.dataset.view)));
  tb.querySelectorAll("[data-menu]").forEach(b=>b.onclick=e=>{e.stopPropagation();openRowMenu(b.dataset.menu,b)});
  tb.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>openQuickDrawer(b.dataset.quick));
  tb.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>startInlineEdit(b,"notes"));
  tb.querySelectorAll("[data-inline-name]").forEach(b=>b.onclick=()=>startInlineEdit(b,"name"));
  tb.querySelectorAll("[data-loc]").forEach(inp=>{inp.onclick=e=>e.stopPropagation();inp.onchange=()=>{const p=findProfile(inp.dataset.loc);const m=COUNTRIES.find(x=>x[1].toLowerCase()===inp.value.trim().toLowerCase()||x[0].toLowerCase()===inp.value.trim().toLowerCase());if(m){p.fp.country=m[0];p.fp.countryName=m[1];p.fp.flag=m[2];if(p.proxy.mode==="builtin")p.proxy.buyCountry=m[0];hist(p,"Proxy location → "+m[1]);save();if(window.DL)DL.profileUpdated(p);refreshRows(c,cloud);toast("Location updated")}else toast("Country not found",1)}});
}
function startInlineEdit(el,field){
  const p=findProfile(el.dataset.inlineName||el.dataset.note); if(!p)return;
  const cur=field==="name"?p.name:(p.notes||"");
  const inp=document.createElement("input"); inp.className="inline-input"; inp.value=cur; inp.style.minWidth="160px";
  el.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{const v=inp.value.trim(); if(field==="name"&&v){p.name=v;hist(p,"Renamed to “"+v+"”")} if(field==="notes"){p.notes=v;hist(p,"Notes updated")} p.lastUpdate=nowStr(); save(); if(window.DL)DL.profileUpdated(p); showPage(currentPage)};
  inp.onblur=commit; inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();if(e.key==="Escape"){inp.value=cur;inp.blur()}};
}
function openFoldersMenu(anchor){
  const items=S.folders.map(f=>'<button data-f="'+f.id+'"><span class="mi">📁</span><span style="flex:1">'+esc(f.name)+'</span>'+(activeFolder===f.id?'<span style="color:var(--accent2)">✓</span>':"")+'</button>').join("");
  const m=openMenu(anchor,'<div style="padding:4px 6px"><span class="search-pop" style="width:100%">🔍<input id="folderSearch" placeholder="Search folders..." style="width:100%"></span></div><button data-add="1" style="color:var(--accent2);font-weight:600">+ Add folder</button><button data-f=""><span class="mi">📁</span><span style="flex:1">All folders</span>'+(activeFolder===""?'<span style="color:var(--accent2)">✓</span>':"")+'</button>'+items,260);
  m.querySelector("[data-add]").onclick=async()=>{closeMenus();const n=await promptDialog("Add folder","Folder name","","Create folder");if(n&&n.trim()){const f={id:uid(),name:n.trim()};S.folders.push(f);save();if(window.DL)DL.folderCreated(f);showPage(currentPage);toast("Folder added")}};
  m.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{activeFolder=b.dataset.f;closeMenus();showPage(currentPage)});
  const fs=m.querySelector("#folderSearch"); fs.onclick=e=>e.stopPropagation();
  fs.oninput=()=>{const v=fs.value.toLowerCase();m.querySelectorAll("[data-f]").forEach(b=>{if(b.dataset.f)b.style.display=b.textContent.toLowerCase().includes(v)?"":"none"})};
}
function openColumnsPop(anchor,c,cloud){
  const m=openMenu(anchor,'<button id="colsOpen"><span class="mi">🎛</span>Columns</button>',180);
  m.querySelector("#colsOpen").onclick=()=>{closeMenus();openColumnsModal(c,cloud)};
}
const COL_GROUPS=[["Proxies",["proxyType","proxyPort","proxyUser","proxyPass"]],["Profile Notes",["notes","tags"]],["Status",["state"]],["Profile Info",["os","browserVersion","sharing"]],["Date & Time",["lastUpdate","lastLaunch","created"]]];
function openColumnsModal(c,cloud){
  const label=k=>(COL_DEFS.find(x=>x[2]===k)||[])[1]||k;
  const body=COL_GROUPS.map(g=>'<div class="ed-sec" style="margin:12px 0 6px;font-size:14px">'+g[0]+'</div>'+g[1].map(k=>'<div class="kv-row" style="padding:7px 0"><span class="checkbox'+(S.columns[k]?" on":"")+'" data-col="'+k+'">'+(S.columns[k]?"✓":"")+'</span><span style="flex:1">'+label(k)+'</span><span>'+(S.columns[k]?"👁":"🚫")+'</span></div>').join("")).join("");
  const ov=openModal("Column Settings",body,'<button class="btn btn-primary" data-close="1">Done</button>');
  ov.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{const k=b.dataset.col;S.columns[k]=!S.columns[k];save();b.classList.toggle("on",S.columns[k]);b.textContent=S.columns[k]?"✓":"";showPage(currentPage)});
}
/* ---------- row 3-dots menu (capture order) ---------- */
function openRowMenu(pid,anchor){
  const p=findProfile(pid); if(!p)return;
  const dis='<span class="mi"></span>';
  const m=openMenu(anchor,
   '<button data-a="settings"><span class="mi">⚙</span>Settings</button>'
  +'<button data-a="folders"><span class="mi">📁</span>Folders</button>'
  +'<button disabled>'+dis+'Share</button>'
  +'<button data-a="clone"><span class="mi">⧉</span>Clone</button>'
  +'<button disabled>'+dis+'Transfer</button>'
  +'<button data-a="cookies"><span class="mi">🍪</span>Cookies</button>'
  +'<button data-a="history"><span class="mi">🕘</span>History</button>'
  +'<button data-a="runlink"><span class="mi">🔗</span>Copy "Run" link</button>'
  +'<button data-a="copyid"><span class="mi">⧉</span>Copy ID</button>'
  +'<button data-a="pin"><span class="mi">📌</span>'+(p.pinned?"Unpin":"Pin")+'</button>'
  +'<button data-a="delete"><span class="mi">🗑</span>Delete</button>'
  +'<button disabled>'+dis+'Automation</button>',240);
  const act={
    settings:()=>openQuickDrawer(pid),
    folders:()=>foldersDialog(p),
    clone:()=>{cloneProfile(p);showPage(currentPage);toast("Profile cloned")},
    cookies:()=>cookiesDialog(p),
    history:()=>historyDialog(p),
    runlink:()=>copyText("https://devxyzlogin.local/run/"+p.id,"Run link copied"),
    copyid:()=>copyText(p.id,"Profile ID copied"),
    pin:()=>{p.pinned=!p.pinned;save();showPage(currentPage)},
    delete:async()=>{if(await confirmDialog("Delete profile","Move “"+p.name+"” to Restore profiles? It will be auto-deleted after 120 hours.","Move to trash")){softDelete(p);showPage(currentPage);toast("Profile moved to trash")}}
  };
  m.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{closeMenus();act[b.dataset.a]()});
}
function cloneProfile(p){
  const cp=clone(p); cp.id=uid(); delete cp.serverId; cp.name=p.name+" copy"; cp.state="ready"; cp.createdAt=nowStr(); cp.lastUpdate=nowStr(); cp.lastLaunch="";
  cp.history=[{t:nowStr(),a:"Cloned from "+p.name}]; S.profiles.unshift(cp); save(); if(window.DL)DL.profileCloned(p,cp); return cp;
}
function softDelete(p){
  p.deletedAt=nowStr(); p.deletedBy=S.email; p.state="ready"; delete runMap[p.id];
  S.profiles=S.profiles.filter(x=>x.id!==p.id); S.deleted.unshift(p); selected.delete(p.id); save(); if(window.DL)DL.profileDeleted(p);
}
function foldersDialog(p){
  const body=S.folders.length?S.folders.map(f=>{const on=(p.folderIds||[]).includes(f.id)||p.folderId===f.id;return '<div class="kv-row"><span class="checkbox'+(on?" on":"")+'" data-fid="'+f.id+'">'+(on?"✓":"")+'</span><span style="flex:1">'+esc(f.name)+'</span></div>'}).join(""):'<p class="sub-text">No folders yet. Create one from the folders menu.</p>';
  const ov=openModal("Folders — "+p.name,body,'<button class="btn btn-primary" data-close="1">Done</button>');
  ov.querySelectorAll("[data-fid]").forEach(b=>b.onclick=()=>{const id=b.dataset.fid;let ids=p.folderIds||[];ids=ids.includes(id)?ids.filter(x=>x!==id):[...ids,id];p.folderIds=ids;p.folderId=ids[0]||"";save();if(window.DL)DL.profileUpdated(p);b.classList.toggle("on",ids.includes(id));b.textContent=ids.includes(id)?"✓":""});
}
function cookiesDialog(p){
  const render=()=>{
    const rows=(p.cookies||[]).map((ck,i)=>'<div class="kv-row"><span style="flex:1"><b>'+esc(ck.name)+'</b> <span class="sub-text">'+esc(trunc(ck.value))+'</span></span><button class="btn btn-sm" data-del="'+i+'">Delete</button></div>').join("")||'<p class="sub-text">No cookies stored for this profile yet.</p>';
    const ov=openModal("Cookies — "+p.name,
      '<div class="field"><label class="label">Add cookie</label><div style="display:flex;gap:8px"><input class="input" id="ckName" placeholder="name"><input class="input" id="ckVal" placeholder="value"><button class="btn btn-primary" id="ckAdd">Add</button></div></div>'
      +'<div class="field"><label class="label">Import cookies</label><textarea class="input" id="ckImport" rows="3" placeholder="JSON array or name=value; name2=value2"></textarea><button class="btn" id="ckImpBtn" style="margin-top:8px">Import Cookies</button></div>'
      + rows,
      '<button class="btn" id="ckExport">Export</button><button class="btn btn-danger-o" id="ckClear">Delete all</button><button class="btn btn-primary" data-close="1">Done</button>',true);
    ov.querySelector("#ckAdd").onclick=()=>{const n=ov.querySelector("#ckName").value.trim(),v=ov.querySelector("#ckVal").value;if(!n)return toast("Cookie name required",1);p.cookies.push({name:n,value:v});hist(p,"Cookie added: "+n);save();if(window.DL)DL.profileUpdated(p);closeModal();render()};
    ov.querySelector("#ckImpBtn").onclick=()=>{const t=ov.querySelector("#ckImport").value.trim();if(!t)return;let n=0;try{const arr=JSON.parse(t);if(Array.isArray(arr))arr.forEach(ck=>{if(ck.name){p.cookies.push({name:ck.name,value:String(ck.value||"")});n++}})}catch(e){t.split(/[;\n]/).map(s=>s.trim()).filter(Boolean).forEach(pair=>{const i=pair.indexOf("=");if(i>0){p.cookies.push({name:pair.slice(0,i).trim(),value:pair.slice(i+1).trim()});n++}})}
      hist(p,"Imported "+n+" cookies");save();if(window.DL)DL.profileUpdated(p);closeModal();render();toast(n+" cookies imported")};
    ov.querySelector("#ckExport").onclick=()=>download(p.name+"-cookies.json",JSON.stringify(p.cookies||[],null,2));
    ov.querySelector("#ckClear").onclick=async()=>{if(await confirmDialog("Delete all cookies","Remove all cookies from “"+p.name+"”?","Delete all")){p.cookies=[];hist(p,"All cookies deleted");save();if(window.DL)DL.profileUpdated(p);closeModal();render()}};
    ov.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{p.cookies.splice(+b.dataset.del,1);save();if(window.DL)DL.profileUpdated(p);closeModal();render()});
  };
  render();
}
function historyDialog(p){
  openModal("History — "+p.name,(p.history||[]).map(h=>'<div class="kv-row"><span style="flex:1">'+esc(h.a)+'</span><span class="sub-text">'+esc(h.t)+'</span></div>').join("")||'<p class="sub-text">No history yet.</p>','<button class="btn btn-primary" data-close="1">Close</button>');
}
</script>

<script>
/* ================= run simulation + API console ================= */
function openRunMenu(pid,anchor){
  const m=openMenu(anchor,
   '<button data-r="manual"><span style="color:var(--accent2);font-size:16px">▶</span><span><b>Manual control</b><br><span class="sub-text">Open the cloud browser in a new tab</span></span></button>'
  +'<button data-r="api"><span style="font-size:16px">🤖</span><span><b>API control</b><br><span class="sub-text">Run Puppeteer against this session</span></span></button>',280);
  m.querySelector('[data-r="manual"]').onclick=()=>{closeMenus();startProfile(pid,"manual")};
  m.querySelector('[data-r="api"]').onclick=()=>{closeMenus();startProfile(pid,"api")};
}
function startProfile(pid,mode){
  const p=findProfile(pid); if(!p||p.state==="running")return;
  runMap[pid]={phase:"downloading",mode:mode,startedAt:Date.now()};
  hist(p,"Run started ("+mode+")"); save(); showPage(currentPage);
  setTimeout(()=>{
    if(!runMap[pid])return;
    runMap[pid].phase="running"; p.state="running"; p.lastLaunch=nowStr(); p.lastUpdate=nowStr();
    S.runLog.push({date:fmtDate(new Date()).split(" ").slice(0,3).join(" "),profileId:pid,secs:0,concurrent:1});
    save(); if(currentPage==="profiles"||currentPage==="cloud")showPage(currentPage);
    if(mode==="api")renderConsole(p); else openSessionPanel(p);
  },2400);
}
function stopProfile(pid,c,cloud){
  const p=findProfile(pid); if(!p)return;
  const r=runMap[pid]; if(r)r.phase="syncing";
  if(c)refreshRows(c,cloud); else showPage(currentPage);
  setTimeout(()=>{
    const started=r?r.startedAt:Date.now();
    const secs=Math.max(1,Math.round((Date.now()-started)/1000));
    const log=[...S.runLog].reverse().find(l=>l.profileId===pid&&l.secs===0); if(log)log.secs=secs;
    delete runMap[pid]; p.state="ready"; hist(p,"Session stopped ("+secs+"s, synced)"); save();
    if(currentPage==="profiles"||currentPage==="cloud")showPage(currentPage);
  },1100);
}
function openSessionPanel(p){
  if(!p)return;
  const fp=p.fp;
  const ov=openModal("☁ Cloud browser — "+p.name,
   '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span class="dot running"></span><b>running</b><span class="sub-text">· '+(fp.flag||"")+' '+esc(fp.countryName||"")+' · '+esc((p.proxy&&p.proxy.buyType)||"Residential")+' · '+esc(profProxyIP(p))+'</span><span style="flex:1"></span><span class="sub-text">Local simulation preview</span></div>'
  +'<div class="preview-box" style="min-height:180px;flex-direction:column;gap:8px"><div style="font-size:26px">🌐</div><div>The profile browser runs with this fingerprint applied.<br>Verify it on a checker:</div><div style="display:flex;gap:9px"><a class="btn btn-sm" href="https://iphey.com" target="_blank" rel="noopener">iphey.com</a><a class="btn btn-sm" href="https://pixelscan.net" target="_blank" rel="noopener">pixelscan.net</a><a class="btn btn-sm" href="https://browserleaks.com" target="_blank" rel="noopener">browserleaks.com</a></div></div>'
  +'<div style="margin-top:12px">'
  +[["User-Agent",fp.ua],["Resolution",fp.screen+" · "+fp.platform],["WebGL",fp.webglVendor+" — "+fp.webglRenderer],["Canvas / Audio / Rects",fp.canvas+" / "+fp.audioContext+" / "+fp.clientRects],["Timezone / Language",(fp.timezoneAuto?"Based on IP":fp.timezone)+" / "+(fp.languages||[]).join(", ")],["WebRTC",fp.webrtc]].map(r=>'<div class="sum-row"><span class="sl">'+r[0]+'</span><span class="sv">'+esc(r[1])+'</span></div>').join("")
  +'</div>',
   '<button class="btn" data-close="1">Close</button><button class="btn btn-danger-o" id="sessStop">Stop</button>',true);
  ov.querySelector("#sessStop").onclick=()=>{closeModal();stopProfile(p.id)};
}
const DEFAULT_SCRIPT="await page.goto('https://example.com');\nawait page.waitForSelector('body');\n\nconst title = await page.evaluate(() => document.title);\nconsole.log(title);";
function renderConsole(p){
  currentPage="console"; renderTopbar(); renderSidebar();
  const tok=(S.tokens[0]||{}).token||S.apiToken;
  const masked=tok.slice(0,10)+"••••••••••••"+tok.slice(-4);
  const c=$("#content");
  c.innerHTML='<div class="console-head"><span style="font-size:17px">📁 <b>'+esc(p.name)+'</b></span>'
   +'<span style="flex:1;text-align:center" class="sub-text">🌐 '+esc(p.fp.countryName||"")+' · '+esc(((p.proxy&&p.proxy.buyType)||"residential").toLowerCase())+' · '+esc(profProxyIP(p))+'</span>'
   +'<span class="state-cell"><span class="dot busy" id="consDot"></span><span id="consStatus">connecting</span></span>'
   +'<button class="btn btn-green" id="consRun" disabled>▶ Run</button></div>'
   +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="code-block" style="flex:0 1 auto">'+esc(masked)+'</span><button class="btn btn-sm" id="consCopy">⧉ Copy token</button><span style="flex:1"></span><a id="consDocs">Cloud Browser docs</a></div>'
   +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div style="display:flex;justify-content:space-between"><b style="color:var(--accent2);font-size:16px">Script</b><span class="sub-text">Uses the Puppeteer page API</span></div>'
   +'<textarea class="input" id="consScript" rows="9" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;margin-top:8px">'+esc(DEFAULT_SCRIPT)+'</textarea></div>'
   +'<div><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(--accent2);font-size:16px">Live preview</b><span><button class="btn btn-sm" id="consTab">Open in tab</button> <button class="btn btn-sm" id="consFull">Fullscreen</button></span></div>'
   +'<div class="preview-box" id="consPreview" style="margin-top:8px">Session preview will appear here.<br>Press ▶ Run to execute the script.</div></div></div>'
   +'<div style="margin-top:16px"><b style="color:var(--accent2);font-size:16px">Logs</b><div class="log-panel" id="consLogs" style="margin-top:8px"></div></div>';
  const logs=c.querySelector("#consLogs"), dot=c.querySelector("#consDot"), status=c.querySelector("#consStatus"), runBtn=c.querySelector("#consRun");
  const ts=()=>{const d=new Date();return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":")};
  const log=(msg,err)=>{logs.innerHTML+='<div'+(err?' class="err"':"")+'>'+ts()+" "+esc(msg)+"</div>";logs.scrollTop=logs.scrollHeight};
  log("[session] connecting profileId="+p.id);
  setTimeout(()=>{dot.className="dot running";status.textContent="connected";runBtn.disabled=false;log("[session] connected — browser session live (local simulation)")},1200);
  c.querySelector("#consCopy").onclick=()=>copyText(tok,"Token copied");
  c.querySelector("#consDocs").onclick=()=>openModal("Cloud Browser docs",'<p class="sub-text" style="font-size:13.5px">Connect Puppeteer to a running profile session with the API token above. Endpoint shape mirrors the DevxyzLogin server API: start a profile, receive a session URL, connect your script, stop the profile when done.</p><div class="code-block">const browser = await puppeteer.connect({ browserWSEndpoint: sessionUrl });</div>','<button class="btn btn-primary" data-close="1">OK</button>');
  c.querySelector("#consTab").onclick=()=>openSessionPanel(p);
  c.querySelector("#consFull").onclick=()=>toast("Fullscreen preview is part of the hosted cloud viewer");
  runBtn.onclick=()=>{
    const script=c.querySelector("#consScript").value;
    const preview=c.querySelector("#consPreview");
    log("[run] executing script…");
    const lines=script.split("\n").map(s=>s.trim()).filter(Boolean);
    let delay=300, title="Example Domain";
    lines.forEach(line=>{
      setTimeout(()=>{
        const g=line.match(/page\.goto\(['"]([^'"]+)['"]\)/);
        if(g){const url=g[1];title=url.includes("example.com")?"Example Domain":url.replace(/^https?:\/\//,"").split("/")[0];preview.innerHTML='<div><div style="font-size:30px">🌐</div><b style="color:#E5E7EB;font-size:16px">'+esc(title)+'</b><div style="margin-top:6px">'+esc(url)+'</div><div style="margin-top:6px">Page loaded inside profile “'+esc(p.name)+'” — fingerprint applied.</div></div>';log("[page] goto "+url+" → 200 OK");return}
        if(line.includes("waitForSelector")){log("[page] selector found: body");return}
        if(line.includes("document.title")){log("[eval] document.title → \""+title+"\"");return}
        if(line.includes("console.log")){log("[log] "+title);return}
        log("[step] "+line);
      },delay); delay+=350;
    });
    setTimeout(()=>log("[run] finished"),delay+200);
  };
}
/* ================= bulk bar ================= */
function renderBulk(c,cloud){
  const bar=c.querySelector("#bulkBar"); if(!bar)return;
  const n=selected.size;
  bar.className=n?"show":""; bar.id="bulkBar";
  if(!n){bar.innerHTML="";return}
  const R1=[["stop","⏹ Stop profile"],["folder","📁 Add to Folder"],["proxy","☰ Proxy"],["share","👤 Share Profile"],["tags","🏷 Edit tags"],["ext","🧩 Edit extensions"],["bm","⭐ Edit bookmarks"],["rename","✎ Rename profile"],["clone","⧉ Clone"],["transfer","⇄ Transfer"],["export","⬇ Export profiles"]];
  const R2=[["cookies","⬇ Export all cookies"],["fp","↻ Update fingerprint"],["del","🗑 Delete"],["auto","⚡ Automation"]];
  bar.innerHTML='<div class="bulk-row"><button class="icon-btn" id="bulkX">✕</button><b>Selected '+n+'</b></div>'
   +'<div class="bulk-row">'+R1.map(b=>'<button class="bulk-btn" data-b="'+b[0]+'">'+b[1]+'</button>').join("")+'</div>'
   +'<div class="bulk-row">'+R2.map(b=>'<button class="bulk-btn" data-b="'+b[0]+'">'+b[1]+'</button>').join("")+'</div>';
  bar.querySelector("#bulkX").onclick=()=>{selected.clear();refreshRows(c,cloud);renderBulk(c,cloud)};
  bar.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>bulkAction(b.dataset.b,c,cloud));
}
function selProfiles(){return [...selected].map(findProfile).filter(Boolean)}
async function bulkAction(a,c,cloud){
  const list=selProfiles(); if(!list.length)return;
  if(a==="stop"){list.forEach(p=>{if(p.state==="running")stopProfile(p.id,c,cloud)});toast("Stop sent to "+list.length+" profile(s)")}
  else if(a==="clone"){list.forEach(p=>cloneProfile(p));toast(list.length+" profile(s) cloned");showPage(currentPage)}
  else if(a==="del"){if(await confirmDialog("Delete profiles","Move "+list.length+" profile(s) to Restore profiles?","Move to trash")){list.forEach(p=>softDelete(p));showPage(currentPage);toast("Profiles moved to trash")}}
  else if(a==="fp"){list.forEach(p=>{const os=p.fp.os;p.fp=genFingerprint(os);hist(p,"Fingerprint updated (bulk)")});save();if(window.DL)DL.profilesUpdated(list);showPage(currentPage);toast("Fingerprints updated")}
  else if(a==="export"){download("devxyzlogin-profiles.json",JSON.stringify(list,null,2));toast("Exported "+list.length+" profile(s)")}
  else if(a==="cookies"){const all={};list.forEach(p=>all[p.name]=p.cookies||[]);download("devxyzlogin-cookies.json",JSON.stringify(all,null,2))}
  else if(a==="folder"){
    const body=S.folders.map(f=>'<div class="kv-row"><span class="checkbox" data-bf="'+f.id+'"></span><span style="flex:1">'+esc(f.name)+'</span></div>').join("")||'<p class="sub-text">No folders yet.</p>';
    const ov=openModal("Add to Folder",body,'<button class="btn btn-primary" data-close="1">Done</button>');
    ov.querySelectorAll("[data-bf]").forEach(b=>b.onclick=()=>{const fid=b.dataset.bf;list.forEach(p=>{p.folderIds=p.folderIds||[];if(!p.folderIds.includes(fid))p.folderIds.push(fid);p.folderId=p.folderIds[0]});save();if(window.DL)DL.profilesUpdated(list);b.classList.add("on");b.textContent="✓";toast("Added to folder")});
  }
  else if(a==="proxy"){
    const ov=openModal("Assign proxy",'<div class="field"><label class="label">Saved proxy</label><select class="input" id="bpSel"><option value="">Without proxy</option>'+S.proxies.map(px=>'<option value="'+px.id+'">'+esc(px.name)+" — "+esc(px.host)+":"+esc(px.port)+'</option>').join("")+'</select></div><div class="field"><label class="label">…or built-in by country</label><select class="input" id="bpCountry"><option value="">—</option>'+COUNTRIES.map(x=>'<option value="'+x[0]+'">'+x[2]+" "+x[1]+" (Residential)"+'</option>').join("")+'</select></div>','<button class="btn" data-close="1">Cancel</button><button class="btn btn-primary" id="bpApply">Apply to '+list.length+'</button>');
    ov.querySelector("#bpApply").onclick=()=>{const sid=ov.querySelector("#bpSel").value,cc=ov.querySelector("#bpCountry").value;list.forEach(p=>{if(cc){p.proxy={...p.proxy,mode:"builtin",buyCountry:cc,proxyId:""}}else if(sid){p.proxy={...p.proxy,mode:"custom",proxyId:sid}}else{p.proxy={...p.proxy,mode:"none",proxyId:""}}hist(p,"Proxy updated (bulk)")});save();if(window.DL)DL.profilesUpdated(list);closeModal();showPage(currentPage);toast("Proxy assigned")};
  }
  else if(a==="share"){openModal("Share Profile",'<p class="sub-text" style="font-size:13.5px">Anyone with this link can view the selected profile(s) in read-only mode (local demo link).</p><div class="code-block">https://devxyzlogin.local/share/'+list[0].id+'</div>','<button class="btn" data-close="1">Close</button><button class="btn btn-primary" id="shCopy">Copy link</button>').querySelector("#shCopy").onclick=()=>copyText("https://devxyzlogin.local/share/"+list[0].id,"Share link copied")}
  else if(a==="tags"){
    const ov=openModal("Edit tags",'<div class="field"><label class="label">Add a tag to all selected</label><div style="display:flex;gap:8px"><input class="input" id="btName" placeholder="tag name"><button class="btn btn-primary" id="btAdd">Add</button></div></div>'+allTagsHtml(list),'<button class="btn btn-primary" data-close="1">Done</button>');
    ov.querySelector("#btAdd").onclick=()=>{const t=ov.querySelector("#btName").value.trim();if(!t)return;list.forEach(p=>{if(!p.tags.some(x=>x.text===t))p.tags.push({text:t,color:pick(TAG_COLORS)})});save();if(window.DL)DL.profilesUpdated(list);closeModal();showPage(currentPage);toast("Tag added")};
  }
  else if(a==="ext"){extModal(list)}
  else if(a==="bm"){
    const ov=openModal("Edit bookmarks",'<div class="field"><label class="label">Bookmarks (folder::name::url per line) — applied to all selected</label><textarea class="input" id="bbText" rows="10">'+esc(list[0].bookmarks||"")+'</textarea></div>','<button class="btn" data-close="1">Cancel</button><button class="btn btn-primary" id="bbSave">Apply</button>',true);
    ov.querySelector("#bbSave").onclick=()=>{list.forEach(p=>{p.bookmarks=ov.querySelector("#bbText").value;hist(p,"Bookmarks updated (bulk)")});save();if(window.DL)DL.profilesUpdated(list);closeModal();toast("Bookmarks updated")};
  }
  else if(a==="rename"){if(list.length!==1)return toast("Select exactly 1 profile to rename",1);const n=await promptDialog("Rename profile","Profile name",list[0].name,"Rename");if(n&&n.trim()){list[0].name=n.trim();save();if(window.DL)DL.profileUpdated(list[0]);showPage(currentPage)}}
  else if(a==="transfer"){const em=await promptDialog("Transfer","Transfer "+list.length+" profile(s) to (email)","","Transfer");if(em)toast("Transfer request sent to "+em+" (local demo)")}
  else if(a==="auto"){
    const ov=openModal("Automation — Cookie Bot",'<p class="sub-text" style="font-size:13.5px">Cookie Bot warms up profiles by visiting popular sites and collecting cookies, so profiles look naturally used.</p><div class="log-panel" id="botLog" style="height:130px;margin-top:10px"></div>','<button class="btn" data-close="1">Close</button><button class="btn btn-primary" id="botStart">Start warm-up</button>');
    const lg=ov.querySelector("#botLog");
    ov.querySelector("#botStart").onclick=()=>{let i=0;const sites=["google.com","youtube.com","facebook.com","amazon.com","wikipedia.org"];lg.innerHTML="";const tick=()=>{if(i>=list.length*2){lg.innerHTML+="<div>✓ Warm-up complete — cookies collected.</div>";list.forEach(p=>{p.cookies.push({name:"warmup_"+Date.now().toString(36),value:"1"});hist(p,"Cookie Bot warm-up")});save();if(window.DL)DL.profilesUpdated(list);return}const p=list[i%list.length];lg.innerHTML+="<div>["+p.name+"] visiting "+sites[i%sites.length]+"…</div>";lg.scrollTop=lg.scrollHeight;i++;setTimeout(tick,420)};tick()};
  }
}
function allTagsHtml(list){
  const tags=new Map();list.forEach(p=>p.tags.forEach(t=>tags.set(t.text,t)));
  if(!tags.size)return '<p class="sub-text">No tags on selected profiles.</p>';
  return [...tags.values()].map(t=>'<span class="tag-chip" style="background:'+t.color+'">'+esc(t.text)+'</span>').join("");
}
function extModal(list){
  const body=EXT_CATALOG.map(x=>{const on=list.every(p=>(p.extensions||[]).includes(x));return '<div class="kv-row"><span class="checkbox'+(on?" on":"")+'" data-ext="'+esc(x)+'">'+(on?"✓":"")+'</span><span style="flex:1">'+esc(x)+'</span></div>'}).join("")
   +'<div class="field" style="margin-top:12px"><label class="label">Upload custom extension (unpacked)</label><input type="file" id="extFile" webkitdirectory directory multiple><p class="sub-text">Extensions flagged here apply to all new profiles too.</p></div>';
  const ov=openModal("Extensions",body,'<button class="btn btn-primary" data-close="1">Done</button>');
  ov.querySelectorAll("[data-ext]").forEach(b=>b.onclick=()=>{const x=b.dataset.ext;const on=list.every(p=>(p.extensions||[]).includes(x));list.forEach(p=>{p.extensions=on?p.extensions.filter(e=>e!==x):[...new Set([...(p.extensions||[]),x])]});save();if(window.DL)DL.profilesUpdated(list);showPage(currentPage);closeModal();extModal(list)});
  ov.querySelector("#extFile").onchange=e=>{if(e.target.files.length){toast("Custom extension noted: "+e.target.files[0].name+" (stored as profile extension)")}};
}
</script>

<script>

  +'<div class="qs-head-card"><div style="flex:1"><b style="font-size:15.5px">Set up your browsing identity</b><p class="sub-text" style="margin-top:3px">Configure your IP, device, and browser settings to create a consistent profile.</p></div><div style="font-size:34px">🪪</div></div>'
  +'<div class="qs-bar"><b>Profile essentials</b><div class="sub-text">Check the key details for your profile</div></div>'

  + qsSection("Proxy & Location",
      drawerRow("Proxy",esc(c[1].toUpperCase()),false)
     +drawerRow("Timezone",esc(fp.timezoneAuto?"Based on IP":fp.timezone),false)

     +drawerRow("Custom DNS",fp.customDns?'<input class="input" id="drDns" value="'+esc(fp.customDns)+'" style="height:36px">':'<a id="drDnsAdd">+ Add custom DNS</a>',false))
  + qsSection("Browser",
      drawerRow("User Agent",'<input class="input" id="drUA" value="'+esc(fp.ua)+'" style="height:36px;font-size:12px">',false)
     +drawerRow("Cookies",'<a id="drCookies2">Add cookies</a>',false)
     +drawerRow("Bookmarks",'<a id="drBm">'+bookmarkCount(p.bookmarks)+' bookmarks</a>',false)
     +drawerRow("Start URL",'<select class="input" id="drStart" style="height:36px">'+["Open new tab page","Previously opened tabs","Specified pages"].map(v=>'<option '+(fp.startUrl===v?"selected":"")+'>'+v+'</option>').join("")+'</select>',false)
     +drawerRow("Launch arguments",fp.launchArgs?'<input class="input" id="drArgs" value="'+esc(fp.launchArgs)+'" style="height:36px">':'<a id="drArgsAdd">Add launch arguments</a>',false)
     +drawerRow("Languages",esc(langStr),false)
     +drawerRow("Extensions",'<a id="drExt">Add extensions</a> <span class="sub-text">('+(p.extensions||[]).length+')</span>',false)
     +drawerRow("Fonts",(fp.fontsMasking?"Masked ":"Real ")+fp.fontsCount+" fonts",false))
  + qsSection("Storage",
      [["saveTabs","Save tabs"],["saveHistory","Save history"],["saveBookmarks","Save bookmarks"],["googleServices","Enable Google services"],["disableImages","Disable image loading"],["disableAutoplay","Disable video autoplay"],["savePasswords","Save passwords"],["storageLocal","Enable local storage"],["storageIndexedDb","Enable indexedDB"],["pluginsVuln","Browser plugins"],["allowInstallExt","Allow to install extensions"],["systemExt","System Extensions"]].map(t=>drawerRow(t[1],switchHtml(fp[t[0]],t[0]),false)).join(""))
  + qsSection("Hardware",
      drawerRow("Resolution",esc(fp.screen),false)
     +drawerRow("Device memory",fp.ram+" GB",false)
     +drawerRow("Number of threads",fp.cpu+" threads",false)
     +drawerRow("Media Devices",(fp.fontsMasking?"Masked":"Real")+" Cam. "+fp.mediaVideo+" / Mic. "+fp.mediaAudioIn+" / Sp. "+fp.mediaAudioOut,false)
     +drawerRow("Canvas",fp.canvas==="Off"?"Real":"Masked with noise",false)
     +drawerRow("WebGL Image",fp.webglImage==="Off"?"Real":"Masked with noise",false)
     +drawerRow("WebGL info",(fp.webglMetadata==="Mask"?"Masked ":"Real ")+esc(fp.webglVendor)+" / "+esc(fp.webglRenderer),false)
     +drawerRow("Audio Context",fp.audioContext==="Noise"?"Masked with noise":"Real",false));
  /* wiring */
  $("#drClose").onclick=()=>$("#drawerWrap").classList.remove("show");
  $("#drMenu").onclick=e=>{e.stopPropagation();openRowMenu(p.id,e.currentTarget)};
  const upd=(fn,msg)=>{fn();p.lastUpdate=nowStr();save();if(window.DL)DL.profileUpdated(p);if(msg)toast(msg)};
  $("#drName").onchange=e=>upd(()=>{p.name=e.target.value.trim()||p.name;hist(p,"Renamed via quick settings")});
  const dna=$("#drNoteAdd"); if(dna)dna.onclick=()=>{p.notes=" ";renderDrawer();const i=$("#drNote");if(i){i.value="";i.focus()}};
  const dn=$("#drNote"); if(dn)dn.onchange=e=>upd(()=>{p.notes=e.target.value});
  $("#drFolders").onclick=()=>foldersDialog(p);
  $("#drCopyHost").onclick=()=>copyText((p.proxy&&p.proxy.host)||profProxyIP(p),"Proxy host copied");
  $("#drCopyUser").onclick=()=>copyText(proxyUserOf(p)||"","Proxy username copied");
  $("#drProxyLink").onclick=()=>{$("#drawerWrap").classList.remove("show");openEditor(p.id,false,"proxy")};
  $("#drLangEdit").onclick=()=>languagesModal(fp.languages||["en-PH","en","en-US"],fp.timezoneAuto,sel=>{upd(()=>{fp.languages=sel});renderDrawer()});
  $("#drRes").onchange=e=>upd(()=>{fp.screen=e.target.value});
  $("#drCookies").onclick=()=>cookiesDialog(p);
  const dc2=$("#drCookies2"); if(dc2)dc2.onclick=()=>cookiesDialog(p);
  $("#drRefresh").onclick=()=>upd(()=>{const os=fp.os;const nf=genFingerprint(os);Object.assign(fp,nf);hist(p,"Fingerprint refreshed")},"New fingerprint generated");
  $$("#drawer [data-radio]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>upd(()=>{fp[g.dataset.radio]=b.dataset.v;renderDrawer()})));
  const dd=$("#drDnsAdd"); if(dd)dd.onclick=async()=>{const v=await promptDialog("Custom DNS","Custom DNS","","Save");if(v!==null)upd(()=>{fp.customDns=v})};
  const ddns=$("#drDns"); if(ddns)ddns.onchange=e=>upd(()=>{fp.customDns=e.target.value});
  const du=$("#drUA"); if(du)du.onchange=e=>upd(()=>{fp.ua=e.target.value});
  const dbm=$("#drBm"); if(dbm)dbm.onclick=()=>{const ov=openModal("Bookmarks — "+p.name,'<textarea class="input" id="dbmT" rows="10">'+esc(p.bookmarks||"")+'</textarea>','<button class="btn" data-close="1">Cancel</button><button class="btn btn-primary" id="dbmS">Save</button>',true);ov.querySelector("#dbmS").onclick=()=>{upd(()=>{p.bookmarks=ov.querySelector("#dbmT").value});closeModal();renderDrawer()}};
  const dst=$("#drStart"); if(dst)dst.onchange=e=>upd(()=>{fp.startUrl=e.target.value});
  const daa=$("#drArgsAdd"); if(daa)daa.onclick=async()=>{const v=await promptDialog("Launch arguments","Launch arguments (one per line)","","Save");if(v!==null)upd(()=>{fp.launchArgs=v})};
  const dar=$("#drArgs"); if(dar)dar.onchange=e=>upd(()=>{fp.launchArgs=e.target.value});
  const dex=$("#drExt"); if(dex)dex.onclick=()=>extModal([p]);
  $$("#drawer [data-sw]").forEach(sw=>sw.onchange=()=>upd(()=>{fp[sw.dataset.sw]=sw.checked}));
  $$("#drawer .qs-sec-head").forEach(h=>h.onclick=()=>{const b=h.nextElementSibling;b.classList.toggle("hidden");h.querySelector("span").textContent=b.classList.contains("hidden")?"›":"⌄"});
}
function qsSection(title,inner){return '<div class="qs-sec"><button class="qs-sec-head">'+title+' <span>›</span></button><div class="hidden">'+inner+'</div></div>'}
function bookmarkCount(text){return String(text||"").split("\n").map(s=>s.trim()).filter(s=>s&&!s.endsWith("::")).length}
function acceptHeader(langs){return langs.map((l,i)=>i===0?l:l+";q="+(1-i*0.1).toFixed(1)).join(",")}
function languagesModal(current,basedOnIp,onSave){
  let sel=[...current];
  const body='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><b>Accept-Language header: <span id="lmHead">'+esc(acceptHeader(sel))+'</span></b><span style="flex:1"></span><span class="sub-text">Based on IP</span>'+switchHtml(basedOnIp,"lmIp")+'</div>'
   +'<div class="lang-grid"><div><div class="search-pop" style="margin-bottom:8px">🔍<input id="lmSearch" placeholder="Search languages" style="width:100%"></div><div class="lang-list" id="lmList"></div></div>'
   +'<div><div class="label">Selected</div><div id="lmSel"></div></div></div>';
  const ov=openModal("Languages",body,'<button class="btn" data-close="1">Cancel</button><button class="btn btn-primary" id="lmSave">Save</button>',true);
  const renderList=q=>{ov.querySelector("#lmList").innerHTML=LOCALES.filter(l=>!q||l[1].toLowerCase().includes(q)||l[0].toLowerCase().includes(q)).map(l=>'<button class="lang-row" data-l="'+l[0]+'"><span class="checkbox'+(sel.includes(l[0])?" on":"")+'">'+(sel.includes(l[0])?"✓":"")+'</span>'+esc(l[1])+' ('+l[0]+')</button>').join("");
    ov.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const code=b.dataset.l;sel=sel.includes(code)?sel.filter(x=>x!==code):[...sel,code];sync()})};
  const renderSel=()=>{ov.querySelector("#lmSel").innerHTML=sel.map((code,i)=>{const l=LOCALES.find(x=>x[0]===code)||[code,code];return '<div class="sel-lang-row"><span class="drag">⋮⋮</span><span style="flex:1">'+esc(l[1])+' ('+code+')</span>'+(i>0?'<button class="icon-btn" data-up="'+i+'">↑</button>':"")+'</div>'}).join("");
    ov.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[sel[i-1],sel[i]]=[sel[i],sel[i-1]];sync()})};
  const sync=()=>{ov.querySelector("#lmHead").textContent=acceptHeader(sel);renderList(ov.querySelector("#lmSearch").value.toLowerCase());renderSel()};
  ov.querySelector("#lmSearch").oninput=e=>renderList(e.target.value.toLowerCase());
  renderList(""); renderSel();
  ov.querySelector("#lmSave").onclick=()=>{closeModal();onSave(sel.length?sel:["en"])};
}
