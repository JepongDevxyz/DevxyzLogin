name: Build DevxyzLogin Android

# NOTE (standing constraint): the GitHub App used by the agent has no
# `workflows` permission, so this file can only be committed via the GitHub
# web UI. It is included in the project locally for that manual commit.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzLogin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
